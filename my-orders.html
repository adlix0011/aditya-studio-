<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders — Aditya Studio</title>
<style>
:root{--gold:#f4cb48;--ink:#100d0b;--card:#201b17;--muted:#c6bab0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#382414,transparent 38%),linear-gradient(145deg,#0d0b0a,#1c1511);font-family:system-ui,Arial;color:#fff}.wrap{max-width:820px;margin:auto;padding:18px 14px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 20px}.brand{color:var(--gold);font-weight:900;font-size:25px;text-shadow:0 0 18px rgba(244,203,72,.35)}.back{color:#171109;background:linear-gradient(135deg,#f8d65d,#c7951d);font-weight:800;text-decoration:none;padding:10px 14px;border-radius:12px}.hero{border:1px solid rgba(244,203,72,.55);border-radius:24px;padding:22px;background:linear-gradient(120deg,rgba(86,55,15,.62),rgba(44,23,65,.55));box-shadow:0 0 30px rgba(244,203,72,.15)}.hero h1{margin:0;font-size:27px;color:var(--gold)}.hero p{color:var(--muted);margin:7px 0 0}.summary{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.pill{padding:8px 11px;border:1px solid rgba(255,255,255,.16);border-radius:99px;font-size:12px;background:#16120f}.section{margin-top:26px}.section h2{font-size:17px;margin:0 0 10px;color:var(--gold)}.order{background:linear-gradient(145deg,#27201b,#171310);border:1px solid rgba(244,203,72,.24);border-radius:19px;padding:15px;margin:12px 0;box-shadow:0 8px 20px rgba(0,0,0,.22)}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.order h3{margin:0;color:#fff;font-size:16px}.small{font-size:12px;color:var(--muted);line-height:1.55}.badge{font-size:11px;font-weight:900;padding:6px 9px;border-radius:99px;white-space:nowrap}.status-processing{background:#713b0c;color:#fde68a}.status-confirmed,.status-ready{background:#0f5132;color:#bbf7d0}.status-delivered{background:#164e63;color:#a5f3fc}.status-rejected{background:#7f1d1d;color:#fecaca}.timeline{display:flex;align-items:center;margin:17px 0 9px;overflow:hidden}.step{position:relative;flex:1;text-align:center;color:#8f847c;font-size:10px;z-index:1}.dot{width:25px;height:25px;margin:0 auto 5px;border-radius:50%;display:grid;place-items:center;background:#332b25;border:1px solid #62554b}.step.done{color:#d9fae6}.step.done .dot{background:#15803d;border-color:#4ade80;box-shadow:0 0 13px rgba(74,222,128,.5)}.step.current{color:#fff0a7}.step.current .dot{background:#a16207;border-color:#fde047;box-shadow:0 0 16px rgba(253,224,71,.7)}.line{height:3px;flex:1;background:#44392f;margin:0 -10px 21px;z-index:0}.line.done{background:#22c55e}.details{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.detail{padding:10px;border-radius:12px;background:#120f0d;border:1px solid rgba(255,255,255,.07);font-size:12px}.detail b{display:block;color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.notice{margin-top:12px;padding:10px;border-radius:11px;border:1px solid rgba(34,211,238,.45);background:rgba(8,47,73,.45);color:#cffafe;font-size:12px}.empty,.login{padding:30px 18px;text-align:center;border:1px dashed rgba(244,203,72,.35);border-radius:18px;color:var(--muted);margin-top:20px}.login a{color:var(--gold)}@media(max-width:480px){.details{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">Aditya Studio</div><a class="back" href="/">⌂ Home</a></header><section class="hero"><h1>📦 My Orders</h1><p>Apne frame order ka har step yahan clearly track karein.</p><div class="summary" id="summary"></div></section><div id="orders"><div class="empty">Loading your orders…</div></div></main>
<script>
const K='aditya_studio_session_v1',PK='aditya_studio_persistent_login_v2';
function session(){try{return JSON.parse(localStorage.getItem(K)||localStorage.getItem(PK)||'null')}catch(e){return null}}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(o){let s=String(o.status||'processing').toLowerCase();return s==='pending'?'processing':s}
function card(o){let st=status(o), pay=String(o.paymentStatus||'unpaid').toLowerCase(), steps=[['processing','📥','Received'],['confirmed','✅','Confirmed'],['ready','🖼️','Ready'],['delivered','🚚','Delivered']], pos=st==='delivered'?3:st==='ready'?2:st==='confirmed'?1:0, rej=st==='rejected'||st==='cancelled';let timeline=rej?'<div class="notice">❌ This order was not accepted. '+esc(o.adminNote||'Please contact the studio.')+'</div>': '<div class="timeline">'+steps.map((x,i)=>'<div class="step '+(i<pos?'done':i===pos?'current':'')+'"><div class="dot">'+x[1]+'</div>'+x[2]+'</div>'+(i<3?'<div class="line '+(i<pos?'done':'')+'"></div>':'')).join('')+'</div>';let label=rej?'Rejected':st==='delivered'?'Delivered':st==='ready'?'Ready for delivery':st==='confirmed'?'Accepted': 'Order received';return '<article class="order"><div class="order-head"><div><h3>'+esc(o.frameTitle||'Photo Frame')+' <span class="small">('+esc(o.size||'')+')</span></h3><p class="small">Order ID: '+esc(o.orderId||'—')+' · '+new Date(o.createdAt||Date.now()).toLocaleDateString('en-IN')+'</p></div><span class="badge status-'+(rej?'rejected':st)+'">'+label+'</span></div>'+timeline+'<div class="details"><div class="detail"><b>💳 Payment</b>'+(pay==='confirmed'?'✅ Confirmed':pay==='paid_claimed'?'⏳ Verification pending':'⌛ Pending')+'</div><div class="detail"><b>🚚 Delivery</b>'+(o.deliveryDate?esc(o.deliveryDate)+(o.deliveryTime?' · '+esc(o.deliveryTime):''):'Studio will confirm soon')+'</div><div class="detail"><b>💰 Total</b>₹'+esc(o.finalAmount||0)+'</div><div class="detail"><b>📍 Address</b>'+esc(o.address||'Address not added')+'</div></div>'+(o.adminNote&&!rej?'<div class="notice">📣 Studio note: '+esc(o.adminNote)+'</div>':'')+'</article>'}
(async()=>{const s=session(),box=document.getElementById('orders');if(!s||!s.mobile||!s.sessionToken){box.innerHTML='<div class="login">Orders dekhne ke liye pehle <a href="/">Home page par login</a> karein.</div>';return}try{let r=await fetch('/api/my-frame-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:s.mobile,sessionToken:s.sessionToken})}),d=await r.json();if(!r.ok||!d.ok)throw 0;let a=(d.orders||[]).slice().reverse();document.getElementById('summary').innerHTML='<span class="pill">📦 Total '+a.length+'</span><span class="pill">⏳ Active '+a.filter(o=>!['delivered','rejected','cancelled'].includes(status(o))).length+'</span><span class="pill">🚚 Delivered '+a.filter(o=>status(o)==='delivered').length+'</span>';box.innerHTML=a.length?'<section class="section"><h2>✨ Current & Previous Orders</h2>'+a.map(card).join('')+'</section>':'<div class="empty">Abhi koi order nahi hai.</div>'}catch(e){box.innerHTML='<div class="empty">Orders load nahi hue. Home se login dobara check karein.</div>'}})();
</script><script>(function(){const K='aditya_studio_session_v1',P='aditya_studio_persistent_login_v2';function s(){try{return JSON.parse(localStorage.getItem(K)||localStorage.getItem(P)||'null')}catch(e){return null}}function go(a){let x=s();if(x?.sessionToken)fetch('/api/activity',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({sessionToken:x.sessionToken,page:'/my-orders',action:a})})}go('page_view');setInterval(()=>{if(!document.hidden)go('heartbeat')},30000)})();</script></body></html>
