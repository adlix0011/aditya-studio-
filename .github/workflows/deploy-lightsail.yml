name: Deploy Local Delivery

on:
  push:
    branches: [main]

concurrency:
  group: lightsail-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
          test -n "$LIGHTSAIL_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lightsail.pem -o BatchMode=yes "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" 'cd ~/aditya-studio- && git pull --ff-only origin main && sudo systemctl restart aditya-studio && systemctl is-active aditya-studio'
