<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin Roller — Aditya Studio</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,Arial;background:radial-gradient(circle at top,#3b1763,#15100c 54%,#090807);display:grid;place-items:center;padding:20px}.box{width:min(500px,100%);text-align:center;border:1px solid rgba(244,204,72,.58);border-radius:30px;padding:24px;background:rgba(25,17,19,.8);box-shadow:0 0 45px rgba(168,85,247,.35)}h1{color:#f6cd4a;margin:0;font-size:28px;text-shadow:0 0 15px rgba(246,205,74,.55)}p{color:#d0c5bb}.wheel-wrap{position:relative;width:min(340px,82vw);aspect-ratio:1;margin:30px auto}.pointer{position:absolute;z-index:4;top:-16px;left:calc(50% - 19px);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:45px solid #f6d556;filter:drop-shadow(0 0 8px #f6d556)}.wheel{width:100%;height:100%;border-radius:50%;border:13px solid #e8c65a;background:conic-gradient(#7729bd 0 45deg,#d48717 45deg 90deg,#60316e 90deg 135deg,#e9bd16 135deg 180deg,#b51b35 180deg 225deg,#2387a2 225deg 270deg,#18a33b 270deg 315deg,#2363ae 315deg);box-shadow:0 0 0 8px #28160c,0 0 35px rgba(246,205,74,.5);transition:transform 4.7s cubic-bezier(.12,.72,.1,1);position:relative}.wheel:after{content:'📷';position:absolute;inset:calc(50% - 35px);display:grid;place-items:center;border-radius:50%;background:#f4c94e;border:6px solid #321e0a;font-size:31px}.label{position:absolute;left:0;right:0;top:43%;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000}.btn{width:100%;border:0;border-radius:16px;padding:16px;font-weight:900;font-size:17px;cursor:pointer;color:#160f05;background:linear-gradient(135deg,#f9e06c,#d49011);box-shadow:0 0 24px rgba(250,214,73,.5)}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;margin-top:17px;color:#8de7ff;font-weight:700;text-decoration:none}.count{color:#f6cd4a;font-size:17px;font-weight:900}.result{min-height:24px;margin:15px 0;font-weight:800;color:#b8f7d0}
</style></head><body><main class="box"><h1>🎡 Spin Roller</h1><p>Apna reward jeetne ke liye wheel spin karein.</p><p class="count">Spins available: <span id="count">0</span></p><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel"><span class="label">TAP SPIN NOW</span></div></div><p class="result" id="result"></p><button class="btn" id="spin">🎡 SPIN NOW</button><a class="back" href="/">← Back to Home</a></main><script>
const K='aditya_studio_session_v1',PK='aditya_studio_persistent_login_v2';function ses(){try{return JSON.parse(localStorage.getItem(K)||localStorage.getItem(PK)||'null')}catch(e){return null}}let s=ses(),rot=0,busy=false;const cnt=document.getElementById('count'),out=document.getElementById('result'),btn=document.getElementById('spin');if(!s||!s.sessionToken){out.textContent='Pehle Home page par login karein.';btn.disabled=true}else{cnt.textContent=s.spinBalance||0}btn.onclick=async()=>{if(busy)return;if(!s||Number(s.spinBalance||0)<1){out.textContent='Pehle spin code claim karein ya Add Spin karein.';return}busy=true;btn.disabled=true;out.textContent='Roller ghoom raha hai…';try{let r=await fetch('/api/use-spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:s.sessionToken})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Spin fail');rot+=1440+Math.floor(Math.random()*360);document.getElementById('wheel').style.transform='rotate('+rot+'deg)';setTimeout(()=>{s.spinBalance=Number(d.spinBalance||0);localStorage.setItem(K,JSON.stringify(s));localStorage.setItem(PK,JSON.stringify(s));cnt.textContent=s.spinBalance;out.textContent=d.prize&&d.prize.discount?'🎉 '+d.prize.label+' मिला! Coupon: '+d.couponCode:'✨ '+(d.prize?.label||'Good Luck');btn.disabled=false;busy=false},4900)}catch(e){out.textContent=e.message||'Spin fail';btn.disabled=false;busy=false}};
</script><script>(function(){const K='aditya_studio_session_v1',P='aditya_studio_persistent_login_v2';try{let s=JSON.parse(localStorage.getItem(K)||localStorage.getItem(P)||'null');if(s?.sessionToken)fetch('/api/activity',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({sessionToken:s.sessionToken,page:'/spin',action:'spin_roller_opened'})})}catch(e){}})();</script></body></html>
