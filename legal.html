<body><main class="wrap"><div class="top"><a class="brand" href="/">Aditya Studio</a><a class="home" href="/">🏠 Home</a></div><section class="card" id="page"></section></main>
<script>
const pages={
  '/privacy-policy':{title:'Privacy Policy',body:`<p>Last updated: 9 September 2026</p><p>Aditya Studio aapki privacy ko seriously leta hai. Hum sirf studio booking, photo-frame order, coupon aur account service ke liye zaroori information use karte hain.</p><h2>Hum kya collect karte hain</h2><ul><li>Naam aur mobile number — account, booking aur WhatsApp OTP ke liye.</li><li>PIN — server par secure hashed format me store hota hai; plain PIN visible nahi hota.</li><li>Profile photo — agar aap upload karte hain to browser/device me aapki profile ke liye save hoti hai.</li><li>Photo-frame ya editing ke liye upload ki gayi photos — sirf aapka requested order/edit complete karne ke liye.</li><li>Spin, coupon, wallet aur order history — offers aur service records ke liye.</li></ul><h2>Data ka use aur sharing</h2><p>Hum aapka number OTP, order update aur studio support ke liye use kar sakte hain. Aapki photo ya mobile number kisi third party ko becha nahi jata. Sirf order complete karne, legally required situation, ya aapki permission par hi share kiya jayega.</p><h2>Aapke choices</h2><p>Aap apna profile photo change kar sakte hain, account se logout kar sakte hain, aur data-related help ke liye studio se contact kar sakte hain.</p>`},
  '/terms-of-service':{title:'Terms of Service',body:`<p>Aditya Studio website use karte waqt sahi mobile number aur account details dena zaroori hai.</p><h2>Orders and coupons</h2><ul><li>Coupons aur spin rewards account-specific hote hain aur studio verification ke baad hi redeem honge.</li><li>Photo-frame, editing aur booking orders availability aur final studio confirmation par depend karte hain.</li><li>Galat, duplicate ya misuse kiye gaye coupon/orders cancel kiye ja sakte hain.</li></ul><h2>Wallet balance, refund and withdrawal</h2><ul><li>Wallet me add kiya gaya paisa cash me wapas/refund nahi kiya jayega.</li><li>Wallet balance bank account, UPI ya kisi bhi doosre method se withdraw nahi kiya ja sakta.</li><li>Wallet amount ka use sirf Aditya Studio website par available services aur products kharidne ke liye kiya ja sakta hai.</li></ul><h2>Reward verification</h2><p>Spin, coupon ya wallet reward redeem karne ke baad Aditya Studio us reward ko verify karega. Agar technical glitch, duplicate entry, galat value ya system error ki wajah se reward mila ho, to studio use cancel ya correct kar sakta hai. Final confirmation ke baad hi reward/order valid mana jayega.</p><h2>Account safety</h2><p>Apna PIN kisi ke saath share na karein. Account activity ki responsibility account holder ki hoti hai.</p>`},
  '/careers':{title:'Careers',body:`<p>Aditya Studio me photography, photo editing, customer support aur event coordination ke liye opportunities mil sakti hain.</p><h2>Apply kaise karein</h2><p>Apna naam, role aur experience WhatsApp par bhejein. Team suitable opening hone par aapse contact karegi.</p><a class="contact" href="https://wa.me/917024230041?text=Hello%20Aditya%20Studio%2C%20I%20want%20to%20apply%20for%20a%20job." target="_blank" rel="noopener">💬 WhatsApp for Careers</a>`},
  '/contact-us':{title:'Contact Us',body:`<p>Booking, photo frame, coupon, account ya editing help ke liye humse baat karein.</p><h2>Aditya Studio</h2><p><a class="contact" href="tel:+917024230041">📞 +91 70242 30041</a></p><p><a class="contact" href="https://wa.me/917024230041?text=Hello%20Aditya%20Studio%2C%20I%20need%20help." target="_blank" rel="noopener">💬 WhatsApp Help</a></p><p class="muted">Support message me apna naam aur mobile number likh dein, jisse hum aapki request jaldi check kar saken.</p>`}
};
