<!doctype html>
<html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeliveryBro · Delivery Orders</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070d1d;color:#eef3ff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 15px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:23px}.brand img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}.brand b{color:#68f5be}.actions{display:flex;align-items:center;gap:8px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#6d3bff;color:#fff}.ghost{background:#17233d;color:#cbd5e1}.more{font-size:23px;line-height:1;padding:7px 12px}.menu-wrap{position:relative}.menu{position:absolute;right:0;top:44px;width:218px;padding:8px;background:#15223d;border:1px solid #3b5080;border-radius:13px;box-shadow:0 12px 32px #0008;z-index:5}.menu[hidden]{display:none}.menu label{display:flex;align-items:center;gap:10px;padding:9px 7px;font-size:14px;font-weight:700;cursor:pointer}.menu input{width:19px;height:19px;margin:0}.card{background:#101a30;border:1px solid #233557;border-radius:16px;padding:16px;margin:12px 0}.login{max-width:420px;margin:10vh auto}.login h1{margin:0 0 8px}.login p,.sub{color:#9aaccc}input{width:100%;padding:14px;background:#091225;color:#fff;border:1px solid #354b76;border-radius:10px;margin:7px 0 13px}.order{border-left:4px solid #f8bd24}.order.accepted{border-left-color:#40db8b}.top{display:flex;gap:8px;justify-content:space-between;align-items:start}.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:#3a2400;color:#ffd45f}.tag.ok{background:#063c2a;color:#73f7bb}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.details div{background:#0a1326;padding:9px;border-radius:9px;font-size:13px}.details b{display:block;color:#7c91b9;font-size:11px;margin-bottom:4px}.popup[hidden]{display:none}.popup{position:fixed;inset:0;display:grid;place-items:center;background:#000a;padding:18px;z-index:10}.pop{background:#172443;border:1px solid #7454ff;border-radius:20px;padding:22px;max-width:390px;width:100%;box-shadow:0 0 40px #623aff88}.empty{text-align:center;padding:50px 20px;color:#9aaccc}.blink{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 25px #6d3bff}}small{color:#99aace}.error{color:#ff9b9b;min-height:22px}</style>
<body><main class="wrap"><header><div class="brand"><img src="/assets/deliverybro-logo.png" alt="Delivery logo"><span><b>Delivery</b>Bro</span></div><div class="actions"><div class="menu-wrap"><button class="ghost more" id="more" aria-label="Alert settings" title="Alert settings">⋮</button><div id="alertMenu" class="menu" hidden><label><input type="checkbox" id="alertSwitch" checked> Show alert popup</label></div></div><button class="ghost" id="logout" hidden>Logout</button></div></header><section id="login" class="card login"><h1>Delivery boy login</h1><p>अपनी delivery Login ID और password डालें।</p><input id="user" placeholder="Login ID" autocomplete="username"><input id="pass" placeholder="Password" type="password" autocomplete="current-password"><div class="error" id="err"></div><button id="signin" style="width:100%">Login करें</button></section><section id="panel" hidden><div class="card"><small id="shop"></small><h1 style="margin:5px 0">Available food deliveries</h1></div><div id="orders"></div></section></main><div id="popup" class="popup" hidden><div class="pop blink"><button aria-label="Close alert" onclick="document.getElementById('popup').hidden=true" style="float:right;padding:5px 10px;background:#263758">×</button><small>🔔 NEW ORDER</small><h2 id="popTitle">नया order आया है</h2><p id="popText"></p><button onclick="document.getElementById('popup').hidden=true">देखें</button></div></div><script src="/deliverybro.js?v=2"></script></body></html>
