<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell your gadget</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#f8fafc;font:15px Arial}.bar{display:flex;justify-content:space-between;padding:15px 18px;background:#10182b}.bar a{color:#c4b5fd}.wrap{max-width:800px;margin:auto;padding:20px}.poster{display:block;padding:0;margin:0 0 16px;border:0;background:transparent;cursor:pointer;width:100%}.poster img{display:block;width:100%;border-radius:18px;box-shadow:0 10px 28px #0009}.hero,.tabs{display:none}.hero,.card{padding:20px;border-radius:18px;background:#111b31;border:1px solid #2c3b5b;margin-bottom:16px}.hero{background:linear-gradient(120deg,#4c1d95,#2563eb,#0f766e)}h1,h2{margin:0 0 10px}.tabs{display:flex;gap:10px;margin:15px 0}.tabs a{flex:1;text-align:center;padding:12px;border-radius:12px;background:#17213a;color:white;text-decoration:none;font-weight:bold}.tabs .active{background:#7c3aed}label{display:block;font-weight:bold;font-size:13px;margin-top:12px}input,select,textarea{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #425577;background:#091224;color:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload{padding:10px;border:1px dashed #5d72a3;border-radius:10px}.help,.meta,.empty{color:#aab8d4;font-size:12px}.submit,.chat-send{width:100%;padding:14px;margin-top:17px;border:0;border-radius:12px;background:#7c3aed;color:white;font-weight:bold;font-size:15px}.notice{color:#fbbf24;font-weight:bold}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:13px}.listing{overflow:hidden;border-radius:18px;background:linear-gradient(145deg,#132a50,#0b1530);border:1px solid #2b7cff;box-shadow:0 8px 22px #0008;cursor:pointer;transition:.2s}.listing:hover{transform:translateY(-5px);border-color:#a855f7;box-shadow:0 12px 30px #7c3aed55}.listing img{width:100%;height:155px;object-fit:cover}.listing div{padding:13px}.price{color:#38f5ca;font-size:21px;font-weight:bold;margin:8px 0;text-shadow:0 0 12px #38f5ca77}.view{color:#c4b5fd;font-size:12px;font-weight:bold}.modal{position:fixed;inset:0;background:#000b;display:none;z-index:20;overflow:auto;padding:18px}.modal.open{display:block}.detail{max-width:680px;margin:30px auto;background:#101b31;border:1px solid #59458c;border-radius:18px;padding:18px}.close{float:right;background:#24324d;color:white;border:0;border-radius:8px;padding:8px 12px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.photos img{width:100%;height:210px;object-fit:cover;border-radius:12px}.detail-text{white-space:pre-wrap;color:#dbeafe;line-height:1.55}.chat{margin-top:18px;padding-top:14px;border-top:1px solid #304363}.messages{max-height:230px;overflow:auto;background:#091224;border-radius:10px;padding:10px}.msg{padding:8px 10px;border-radius:10px;margin:6px 0;background:#1e293b}.mine{background:#4c1d95;text-align:right}.chat-row{display:flex;gap:8px;margin-top:8px}.chat-row input{margin:0}.chat-row button{width:auto;margin:0;white-space:nowrap}.listing-page{background:radial-gradient(circle at 50% -20%,#4338ca55,#080d1a 45%)}.listing-page .bar{border-bottom:1px solid #276bdc;background:linear-gradient(90deg,#07152f,#10113d)}.listing-page .hero{display:flex;align-items:center;gap:11px;padding:16px 20px;border:1px solid #3b82f6;border-radius:24px;background:linear-gradient(100deg,#071a3c,#1e1b7a 55%,#5b21b6);box-shadow:0 0 26px #2563eb55}.listing-page .hero h1{font-size:24px;margin:0}.listing-page #listtitle{font-size:22px}.listing-page .card:has(#list){background:transparent;border:0;padding:0}.success{min-height:500px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at top,#2d1564,#111b31 55%,#080d1a)}.success-box{max-width:540px}.success-mark{display:grid;place-items:center;margin:0 auto 18px;width:88px;height:88px;border-radius:50%;background:#16a34a;font-size:45px}.success .back{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:bold}@media(max-width:500px){.two,.photos{grid-template-columns:1fr}.photos img{height:220px}}.listing-actions{margin-top:16px;padding-top:14px;border-top:1px solid #304363}.listing-actions button,.call-seller{display:block;width:100%;padding:12px;margin:8px 0;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;text-align:center;text-decoration:none}.listing-actions .sold-listing{background:#059669}.listing-actions .delete-listing{background:#b91c1c}.seller-phone{padding:10px;border-radius:10px;background:#17213a}.listing-actions .buy-message{background:#7c3aed}</style>
<body><header class="bar"><a href="/local">← Local Delivery</a><b>Aditya Marketplace</b></header><main class="wrap" id="app"><button class="poster" type="button" onclick="document.getElementById('sellForm').scrollIntoView({behavior:'smooth',block:'start'})" aria-label="Sell your gadget form खोलें"><img src="/assets/sell-your-gadget-poster.png" alt="Sell your gadget"></button><section class="hero"><h1 id="hero">Sell your gadget</h1></section><nav class="tabs"><a id="sell" href="/sell-gadget">Sell your item</a><a id="mobile" href="/sell-gadget?category=mobile">Second-hand mobiles</a></nav><section class="card" id="sellForm"><h2>अपना item बेचने के लिए post करें</h2><form id="f"><label>Item का नाम *<input name="title" maxlength="100" required placeholder="जैसे: Samsung Galaxy M14"></label><div class="two"><label>Category *<select name="category" id="category"><option value="mobile">Mobile phone</option><option value="electronics">Electronics</option><option value="computer">Computer / Laptop</option><option value="appliance">Home appliance</option><option value="furniture">Furniture</option><option value="vehicle">Vehicle / accessories</option><option value="fashion">Fashion</option><option value="books">Books / Study</option><option value="other">Other</option></select></label><label>Condition *<select name="condition"><option>Like new</option><option>Good</option><option>Used</option></select></label></div><div class="two"><label>Price (₹) *<input name="price" type="number" min="1" max="10000000" required></label><label>Village / area *<input name="area" maxlength="100" required></label></div><label>Item की detail *<textarea name="description" maxlength="1000" required rows="4" placeholder="Brand, model, उम्र और जरूरी बातें लिखें।"></textarea></label><div class="two"><label class="upload">Photo 1 *<input class="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><label class="upload">Photo 2 (optional)<input class="photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p class="help">Listing submit करने के लिए login जरूरी है। आपका phone number public listing में नहीं दिखेगा।</p><button class="submit">📷 Photos के साथ listing submit करें</button><p class="notice" id="note"></p></form></section><section class="card"><h2 id="listtitle">Latest marketplace listings</h2><div id="list" class="list"></div></section></main><div class="modal" id="modal"><section class="detail" id="detail"></section></div>
<script>const q=new URLSearchParams(location.search),only=q.get('category')==='mobile',listingView=q.get('view')==='listings',$=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(only){$('#mobile').className='active';$('#hero').textContent='Second-hand mobiles';$('#category').value='mobile';$('#listtitle').textContent='Second-hand mobile listings'}else $('#sell').className='active';if(listingView){document.body.classList.add('listing-page');$('#sellForm').style.display='none';document.querySelector('.tabs').style.display='none';document.querySelector('.poster').style.display='none';document.querySelector('.hero').innerHTML='<span style="font-size:25px">📱</span><h1>Second-hand mobiles</h1>'}function session(){try{return JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null')}catch(e){}}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}async function load(){let d=await (await fetch('/api/used-listings'+(only?'?category=mobile':''))).json(),b=$('#list');b.innerHTML=!d.listings?.length?'<p class="empty">अभी कोई listing नहीं है। सबसे पहले अपनी item post करें।</p>':d.listings.map(x=>'<article class="listing" onclick="openListing(\''+esc(x.id)+'\')">'+(x.photos?.[0]?'<img src="'+esc(x.photos[0])+'">':'')+'<div><b>'+esc(x.title)+'</b><p class="price">'+money(x.price)+'</p><p class="meta">'+esc(x.categoryLabel)+' · '+esc(x.condition)+'<br>📍 '+esc(x.area)+'</p><span class="view">पूरा detail और chat देखें →</span></div></article>').join('')}load();async function openListing(id){let s=session(),token=s?.sessionToken?'&sessionToken='+encodeURIComponent(s.sessionToken):'',r=await fetch('/api/used-listings?id='+encodeURIComponent(id)+token),d=await r.json();if(!d.ok)return alert(d.message||'Listing नहीं मिली।');let x=d.listing,mine=!!x.isOwner,msgs=(x.messages||[]).map(m=>'<p class="msg">'+esc(m.senderName||'Buyer')+': '+esc(m.text)+'</p>').join('')||'<p class="meta">Buyer से बात शुरू करने के लिए message भेजें।</p>';$('#detail').innerHTML='<button class="close" onclick="closeListing()">✕</button><h2>'+esc(x.title)+'</h2><p class="price">'+money(x.price)+'</p><p class="meta">'+esc(x.categoryLabel)+' · '+esc(x.condition)+' · 📍 '+esc(x.area)+'<br>Seller: '+esc(x.ownerName)+'</p><div class="photos">'+(x.photos||[]).map(p=>'<img src="'+esc(p)+'">').join('')+'</div><p class="detail-text">'+esc(x.description)+'</p><section class="chat"><h3>💬 Seller से chat करें</h3><div class="messages">'+msgs+'</div>'+(mine?'<p class="meta">यह आपकी listing है। Buyer के messages यहाँ दिखाई देंगे।</p>':s?.sessionToken?'<div class="chat-row"><input id="chatText" maxlength="1000" placeholder="Item के बारे में message लिखें"><button class="chat-send" onclick="sendChat(\''+esc(x.id)+'\')">Send</button></div>':'<p class="notice">Chat के लिए पहले login करें।</p>')+'</section>';$('#modal').className='modal open'}function closeListing(){$('#modal').className='modal'}async function sendChat(id){let text=$('#chatText').value.trim(),s=session();if(!text)return;let r=await fetch('/api/used-listing-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,text,sessionToken:s.sessionToken})}),d=await r.json();if(!d.ok)return alert(d.message||'Message नहीं भेजा गया।');openListing(id)}$('#modal').onclick=e=>{if(e.target===$('#modal'))closeListing()};function read(f){return new Promise((yes,no)=>{if(!f)return yes('');if(f.size>1e7)return no(Error('हर photo maximum 10 MB हो सकती है।'));let r=new FileReader;r.onload=()=>yes(r.result);r.onerror=()=>no(Error('Photo read नहीं हुई।'));r.readAsDataURL(f)})}function success(title){document.title='Post successful — Aditya Marketplace';$('#app').innerHTML='<section class="card success"><div class="success-box"><div class="success-mark">✓</div><h1>Congratulations! आपकी post सफल हो गई</h1><p><b>'+esc(title)+'</b> अब marketplace listing में दिखाई देगी।</p><a class="back" href="/sell-gadget">＋ एक और item post करें</a><br><a class="back" href="/sell-gadget?category=mobile" style="background:#1d4ed8">📱 Mobile listings देखें</a></div></section>'}$('#f').onsubmit=async e=>{e.preventDefault();let s=session(),n=$('#note'),b=e.submitter;if(!s?.sessionToken){n.textContent='पहले Aditya Studio में login करें।';return}try{b.disabled=true;n.textContent='Photos upload हो रही हैं…';let photos=[];for(let f of [...document.querySelectorAll('.photo')].map(x=>x.files[0]).filter(Boolean)){let photo=await read(f),r=await fetch('/api/local-delivery/photo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:s.sessionToken,photo})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Photo upload नहीं हुई।');photos.push(d.url)}let data=Object.fromEntries(new FormData(e.target));data.photos=photos;data.sessionToken=s.sessionToken;let r=await fetch('/api/used-listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Listing save नहीं हुई।');success(d.listing?.title||data.title)}catch(x){n.textContent=x.message}finally{b.disabled=false}}const marketplaceOpenBefore=openListing;openListing=async function(id){await marketplaceOpenBefore(id);const s=session(),token=s?.sessionToken?'&sessionToken='+encodeURIComponent(s.sessionToken):'',r=await fetch('/api/used-listings?id='+encodeURIComponent(id)+token),d=await r.json(),x=d.listing;if(!x)return;const detail=$('#detail'),actions=document.createElement('section');actions.className='listing-actions';if(x.isOwner){actions.innerHTML='<h3>Seller controls</h3><button class="edit-listing">✏️ Edit listing</button><button class="sold-listing">✓ यह item बिक गया</button><button class="delete-listing">🗑 Delete listing</button>';actions.querySelector('.edit-listing').onclick=async()=>{const title=prompt('Item name',x.title),price=prompt('Price',x.price),description=prompt('Details',x.description);if(title===null||price===null||description===null)return;await manageListing(x.id,'edit',{title,price,description});openListing(x.id)};actions.querySelector('.sold-listing').onclick=async()=>{await manageListing(x.id,'sold');closeListing();load()};actions.querySelector('.delete-listing').onclick=async()=>{if(confirm('यह listing delete करें?')){await manageListing(x.id,'delete');closeListing();load()}}}else{const phone=String(x.sellerPhone||'').replace(/\D/g,'');actions.innerHTML='<h3>Seller से बात करें</h3><p class="seller-phone">📞 Seller: <b>'+esc(x.sellerPhone||'Number उपलब्ध नहीं है')+'</b></p>'+(phone?'<a class="call-seller" href="tel:'+esc(phone)+'">📞 Seller को call करें</a>':'')+(s?.sessionToken?'<button class="buy-message">💬 खरीदने के लिए message करें</button>':'<p class="notice">Message और call के लिए login करें।</p>');actions.querySelector('.buy-message')?.addEventListener('click',()=>{const input=$('#chatText');if(input){input.value='नमस्ते, मुझे '+x.title+' खरीदना है। क्या यह अभी available है?';input.focus();input.scrollIntoView({behavior:'smooth',block:'center'})}})}detail.append(actions)};async function manageListing(id,action,extra={}){const s=session(),r=await fetch('/api/used-listings/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,sessionToken:s?.sessionToken,...extra})}),d=await r.json();if(!r.ok||!d.ok)alert(d.message||'Listing update नहीं हुई।');return d}</script></body></html>
