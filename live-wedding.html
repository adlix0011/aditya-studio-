<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Wedding</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff7df;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 0,#a51d64 0,transparent 28%),radial-gradient(circle at 100% 16%,#173c83 0,transparent 33%),linear-gradient(145deg,#120817,#20100c 48%,#091b29);padding:18px 14px 48px}.wrap{max-width:880px;margin:auto}.back{display:inline-flex;color:#fff4c7;text-decoration:none;font-weight:800;padding:10px 14px;border:1px solid #f7c85a99;border-radius:999px;background:#180d1ae6}.hero{margin:18px 0 24px;padding:24px 16px;border-radius:28px;text-align:center;background:linear-gradient(135deg,#1c0e22dd,#092940dd);box-shadow:0 0 38px #d946ef45;overflow:hidden}.names{display:inline-block;max-width:100%;padding:14px 20px;border-radius:18px;font:700 clamp(1.6rem,7vw,3.2rem)/1.1 Georgia,serif;background:linear-gradient(90deg,#fef3c7,#f9cb50,#fb7185,#67e8f9,#fef3c7);background-size:300% 100%;-webkit-background-clip:text;color:transparent;border:2px solid transparent;border-image:linear-gradient(90deg,#facc15,#ec4899,#22d3ee,#facc15) 1;animation:glow 3s linear infinite;filter:drop-shadow(0 0 10px #f0abfaaa)}@keyframes glow{to{background-position:300% 0}}.sub{margin:14px 0 0;color:#f6dca2;font-weight:bold}.cover{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:2px solid #fbbf24;box-shadow:0 0 26px #ec489977;background:#150d14}.cover img{width:100%;height:100%;object-fit:cover}.section-title{text-align:center;font:700 clamp(1.5rem,6vw,2.4rem) Georgia,serif;margin:32px 0 18px;color:#ffdb72}.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.album{min-height:190px;border:0;padding:0;overflow:hidden;border-radius:20px;color:#fff;text-align:left;cursor:pointer;background:#1a1320;box-shadow:0 12px 25px #0007}.album img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.album span{display:block;padding:12px 13px;font:700 18px Georgia,serif;background:linear-gradient(90deg,#3b143d,#113956)}.album small{display:block;padding:0 13px 12px;color:#ffd96b;background:#113956;font-weight:bold}.download{display:block;margin:25px auto 0;max-width:340px;text-align:center;text-decoration:none;color:#19100a;background:linear-gradient(90deg,#f6c94f,#fb7185,#67e8f9);padding:14px;border-radius:14px;font-weight:900}.empty{text-align:center;padding:45px 15px;color:#d8c5a1}@media(max-width:480px){.albums{grid-template-columns:1fr}.hero{padding:20px 10px}}
</style></head><body><main class="wrap"><a class="back" href="/">← Back to Home</a><section class="hero"><div class="names" id="names">Rahul Sharan &amp; Anita Sharma</div><p class="sub">Live Wedding Album · हर याद, हमेशा के लिए</p></section><div class="cover" id="cover"><img id="coverImg" alt="Bride and groom"></div><h2 class="section-title">Wedding Celebrations</h2><section class="albums" id="albums"></section><a id="download" class="download" target="_blank" rel="noopener">Open Google Drive &amp; Download Photos ↗</a></main><script>const labels={chulmati:'Chulmati',devpoojan:'Devpoojan',haldi:'Haldi',barat:'Barat',reception:'Reception'};fetch('/api/home-gallery-samples',{cache:'no-store'}).then(r=>r.json()).then(d=>{let x=d.liveWedding||{},a=x.albums||{};document.title=(x.title||'Live Wedding')+' · Aditya Studio';names.textContent=x.title||'Rahul Sharan & Anita Sharma';if(x.thumbnail)coverImg.src=x.thumbnail;else cover.style.display='none';download.href=x.driveUrl||'#';if(!x.driveUrl)download.style.display='none';albums.innerHTML=Object.keys(labels).map(k=>'<button class="album" '+(x.driveUrl?'onclick="window.open('+JSON.stringify(x.driveUrl)+',\\\'_blank\\\')"':'disabled')+'>'+ (a[k]?'<img src="'+a[k]+'" alt="'+labels[k]+'">':'<div style="height:135px;background:linear-gradient(135deg,#57214e,#124360)"></div>')+'<span>'+labels[k]+'</span><small>View & Download Photos ↗</small></button>').join('')}).catch(()=>{document.body.innerHTML='<p class="empty">Wedding album abhi load nahi hua.</p>'});</script></body></html>
