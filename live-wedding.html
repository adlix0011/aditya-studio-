<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Wedding</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff7df;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 0,#a51d64 0,transparent 28%),radial-gradient(circle at 100% 16%,#173c83 0,transparent 33%),linear-gradient(145deg,#120817,#20100c 48%,#091b29);padding:18px 14px 48px}.wrap{max-width:880px;margin:auto}.back{display:inline-flex;color:#fff4c7;text-decoration:none;font-weight:800;padding:10px 14px;border:1px solid #f7c85a99;border-radius:999px;background:#180d1ae6}.hero{margin:18px 0 24px;padding:24px 16px;border-radius:28px;text-align:center;background:linear-gradient(135deg,#1c0e22dd,#092940dd);box-shadow:0 0 38px #d946ef45;overflow:hidden}.names{display:inline-block;max-width:100%;padding:16px 22px;border-radius:18px;font:800 clamp(1.7rem,7vw,3.25rem)/1.15 Georgia,serif;letter-spacing:.025em;background:linear-gradient(100deg,#fff8d8 0%,#ffd45f 25%,#ff91bd 54%,#8fe9ff 77%,#fff8d8 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;border:1px solid rgba(255,213,88,.85);box-shadow:inset 0 0 22px rgba(255,207,97,.12),0 0 18px rgba(90,216,255,.25);animation:glow 3s linear infinite;filter:drop-shadow(0 2px 5px rgba(0,0,0,.78))}@keyframes glow{to{background-position:300% 0}}.sub{margin:14px 0 0;color:#f6dca2;font-weight:bold}.cover{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:2px solid #fbbf24;box-shadow:0 0 26px #ec489977;background:#150d14}.cover img{width:100%;height:100%;object-fit:cover}.section-title{text-align:center;font:700 clamp(1.5rem,6vw,2.4rem) Georgia,serif;margin:32px 0 18px;color:#ffdb72}.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.album{position:relative;min-height:190px;border:0;padding:0;overflow:hidden;border-radius:20px;color:#fff;text-align:left;cursor:pointer;background:#1a1320;box-shadow:0 12px 25px #0007}.album img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.album-pending{height:135px;display:grid;place-items:center;background:#fff}.album-pending b{color:#1f2937;font:800 20px Georgia,serif;letter-spacing:.04em}.album span{display:block;padding:12px 13px;font:700 18px Georgia,serif;background:linear-gradient(90deg,#3b143d,#113956)}.album small{display:block;padding:0 13px 12px;color:#ffd96b;background:#113956;font-weight:bold}.download{display:block;margin:25px auto 0;max-width:340px;text-align:center;text-decoration:none;color:#19100a;background:linear-gradient(90deg,#f6c94f,#fb7185,#67e8f9);padding:14px;border-radius:14px;font-weight:900}.empty{text-align:center;padding:45px 15px;color:#d8c5a1}@media(max-width:480px){.albums{grid-template-columns:1fr}.hero{padding:20px 10px}}
.album:disabled{cursor:default;opacity:.7}.password-dialog{width:min(420px,calc(100% - 32px));border:1px solid #67e8f9;border-radius:18px;padding:24px;background:#142332;color:#fff7df}.password-dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}.password-dialog h2{margin:0 0 18px;font-size:22px}.password-dialog input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #a5f3fc;border-radius:9px;color:#142332;background:#fff;font-size:16px}.password-actions{display:flex;gap:12px;margin-top:18px}.password-actions button{padding:10px 16px;border-radius:9px;cursor:pointer;background:#f7cf68;color:#201703;font-weight:700;border:0}.password-error{color:#fca5a5;min-height:24px;white-space:pre-wrap}.page-status{color:#fca5a5;text-align:center;padding:12px}.download[hidden]{display:none}.download{border:0;cursor:pointer;font-size:15px;width:100%}
</style></head><body><main class="wrap"><a class="back" href="/">← Back to Home</a><section class="hero"><div class="names" id="names">Live Wedding</div></section><div id="weddingContent" hidden><div class="cover" id="cover"><img id="coverImg" alt="Bride and groom"></div><h2 class="section-title">Wedding Celebrations</h2><section class="albums" id="albums"></section><button type="button" id="download" class="download">Open Google Drive &amp; Download Photos ↗</button></div><p id="pageStatus" class="page-status" role="status">Loading wedding…</p></main>
<dialog id="passwordDialog" class="password-dialog" aria-labelledby="passwordHeading"><form id="passwordForm"><h2 id="passwordHeading">Enter password</h2><label for="albumPassword">Password</label><input id="albumPassword" type="password" autocomplete="off" required maxlength="80"><p id="passwordError" class="password-error" role="alert"></p><div class="password-actions"><button type="submit" id="passwordSubmit">Open album</button><button type="button" id="passwordCancel">Cancel</button></div></form></dialog>
<script>
(function(){
  const labels={chulmati:'Chulmati',devpoojan:'Devpoojan',haldi:'Haldi',barat:'Barat',reception:'Reception'};
  const get=id=>document.getElementById(id),dialog=get('passwordDialog'),field=get('albumPassword'),error=get('passwordError');
  let wedding,id,weddingPassword='',onPassword,onCancel,busy=false;
  async function request(url,body){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
    try{const res=await fetch(url,{method:body?'POST':'GET',cache:'no-store',signal:controller.signal,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const out=await res.json();if(!res.ok||!out.ok)throw Error(out.message||'Request failed');return out;}catch(e){if(e.name==='AbortError')throw Error('Connection slow hai. Dobara try karein.');throw e;}finally{clearTimeout(timer);}
  }
  function ask(title,action,cancel){get('passwordHeading').textContent=title;field.value='';error.textContent='';onPassword=action;onCancel=cancel||(()=>{});dialog.showModal();field.focus();}
  get('passwordForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;get('passwordSubmit').disabled=true;error.textContent='Checking…';try{await onPassword(field.value);dialog.close();}catch(e){error.textContent=e.message;}finally{busy=false;get('passwordSubmit').disabled=false;}};
  const cancel=()=>{if(busy)return;dialog.close();onCancel();};get('passwordCancel').onclick=cancel;dialog.addEventListener('cancel',e=>{e.preventDefault();cancel();});
  async function open(key,password){const result=await request('/api/wedding-open',{id,album:key,password:password||'',weddingPassword});window.location.href=result.url;}
  function openAlbum(key,item){if(item.passwordEnabled&&key!=='main'){ask(labels[key]+' password',pass=>open(key,pass));return;}get('pageStatus').textContent='Opening album…';open(key).catch(e=>get('pageStatus').textContent=e.message);}
  function render(row){
    wedding=row;get('names').textContent=row.title;document.title=row.title+' · Aditya Studio';
    get('cover').hidden=!row.thumbnail;if(row.thumbnail)get('coverImg').src=row.thumbnail;
    const albums=get('albums');albums.textContent='';
    Object.entries(labels).forEach(([key,label])=>{
      const item=(row.albums||{})[key]||{},button=document.createElement('button');button.type='button';button.className='album';button.dataset.album=key;button.disabled=!item.available;
      if(item.thumbnail){const img=document.createElement('img');img.src=item.thumbnail;img.alt=label+' photos';button.append(img);}else{const pending=document.createElement('div');pending.className='album-pending';const text=document.createElement('b');text.textContent='Coming Soon';pending.append(text);button.append(pending);}
      const name=document.createElement('span'),hint=document.createElement('small');name.textContent=label;hint.textContent=!item.available?'Photos coming soon':item.passwordEnabled?'🔒 Enter password to view photos':'View & Download Photos ↗';button.append(name,hint);button.onclick=()=>openAlbum(key,item);albums.append(button);
    });
    get('download').hidden=!row.available;get('download').onclick=()=>openAlbum('main',row);get('weddingContent').hidden=false;get('pageStatus').textContent='';
  }
  request('/api/live-weddings').then(async out=>{
    id=new URLSearchParams(location.search).get('id')||(out.weddings[0]||{}).id;
    wedding=out.weddings.find(row=>row.id===id);if(!wedding)throw Error('Wedding available nahi hai.');get('names').textContent=wedding.title;
    if(wedding.passwordEnabled){get('pageStatus').textContent='Wedding password enter karein.';ask('Open '+wedding.title,async pass=>{const detail=await request('/api/wedding-detail',{id,weddingPassword:pass});weddingPassword=pass;render(detail.wedding);},()=>location.href='/');}else render(wedding);
  }).catch(e=>get('pageStatus').textContent=e.message);
})();
</script></body></html>
