<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <title>Frame Detail · Aditya Studio</title>
  <script src="https://cdn.tailwindcss.com">
let qualityOptionsList = [
  { id: "normal", label: "Normal", sub: "", extra: 0 },
  { id: "lamination", label: "Lamination", sub: "", extra: 80 },
  { id: "ntr", label: "NTR Print", sub: "", extra: 150 }
];
function renderFdQuality() {
  const box = document.getElementById("quality-box");
  if (!box) return;
  const list = qualityOptionsList.length ? qualityOptionsList : [{ id:"normal", label:"Normal", extra:0 }];
  box.innerHTML = list.map(function(q, i) {
    const active = (typeof qualityExtra !== "undefined" && Number(qualityExtra) === Number(q.extra) && i === list.findIndex(x => Number(x.extra)===Number(qualityExtra))) || (i===0 && !(qualityExtra>0));
    const activeCls = "quality-btn active border-2 border-[#3d3530] rounded-lg p-3 text-left text-sm";
    const idleCls = "quality-btn border-2 border-[#3d3530] rounded-lg p-3 text-left text-sm text-[#b7b0a8]";
    const isActive = (window._selQualityId ? window._selQualityId === q.id : i === 0);
    return '<button type="button" class="'+(isActive?activeCls:idleCls)+'" data-id="'+q.id+'" data-extra="'+q.extra+'" data-label="'+String(q.label).replace(/"/g,"&quot;")+">'
      + '<span class="block font-semibold">'+(i+1)+'. '+q.label+'</span>'
      + '<span class="text-xs opacity-70">+₹'+q.extra+'</span></button>';
  }).join("");
  box.querySelectorAll(".quality-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      window._selQualityId = btn.dataset.id;
      if (typeof qualityExtra !== "undefined") qualityExtra = Number(btn.dataset.extra) || 0;
      renderFdQuality();
      // trigger existing price update if any
      try {
        const ev = new Event("click");
        // update total display
        if (typeof updateTotal === "function") updateTotal();
      } catch(e) {}
      // mimic old handler price update
      const totalEl = document.getElementById("total-price") || document.getElementById("price-total");
      if (typeof finalPrice !== "undefined" && totalEl) {
        totalEl.textContent = "₹" + (Math.round(finalPrice) + (Number(qualityExtra)||0));
      }
    });
  });
}
async function loadFdQuality() {
  try {
    const res = await fetch("/api/settings");
    const data = await res.json();
    const list = (data.settings && data.settings.qualityOptions) || [];
    if (list.length) {
      qualityOptionsList = list.map(q => ({
        id: q.id || "q", label: q.label || "Quality", sub: q.sub || "", extra: Number(q.extra)||0
      }));
      window._selQualityId = qualityOptionsList[0].id;
      if (typeof qualityExtra !== "undefined") qualityExtra = qualityOptionsList[0].extra;
    }
  } catch(e) {}
  renderFdQuality();
}
loadFdQuality();

</script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#131313",
            surface: "#1c1b1b",
            "surface-container": "#201f1f",
            "surface-container-high": "#2a2929",
            "on-surface": "#e5e2e1",
            "on-surface-variant": "#b7b0a8",
            outline: "#4f453f",
            "outline-variant": "#3d3530",
            primary: "#f3de9a",
            secondary: "#e9c176",
            "on-secondary": "#241804",
          }
        }
      }
    };
  </script>
  <style>
    body { background: #131313; color: #e5e2e1; margin: 0; }
    .glass-shine {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 10%, transparent 20%),
        linear-gradient(270deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.12) 8%, transparent 18%);
    }
    .fp-wrap { position: relative; line-height: 0; max-width: 100%; }
    .fp-frame { display: block; max-width: 100%; height: auto; object-fit: contain; }
    .fp-photo {
      position: absolute; overflow: hidden;
      left: 14%; right: 14%; top: 15%; bottom: 15%;
    }
    .fp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .type-card.active { border-color: #e9c176; box-shadow: 0 0 0 1px #e9c176; }
    .quality-btn.active { border-color: #e9c176; background: rgba(233,193,118,0.12); color: #e9c176; }
    .swatch.active { outline: 2px solid #e9c176; outline-offset: 2px; }
  
    /* Mobile frame + photo fix — frame always visible, photo fits inside */
    @media (max-width: 768px) {
      #preview-box {
        min-height: 320px !important;
        padding: 10px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      #preview-box .fp-box,
      #preview-box > div {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: 280px !important;
      }
      #preview-box .fp-frame,
      #preview-box img.fp-frame,
      #preview-box img {
        display: block !important;
        max-width: 100% !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      #preview-box .fp-photo {
        z-index: 2 !important;
      }
    }
    /* Colorful buttons */
    label[for], label.cursor-pointer {
      background: linear-gradient(135deg, #f2ca50, #d4af37) !important;
      color: #1a1200 !important;
      font-weight: 700 !important;
      border: none !important;
      box-shadow: 0 4px 12px rgba(212,175,55,0.3);
    }
    #order-btn, #order-btn-m {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      color: #fff !important;
      font-weight: 700 !important;
      border: none !important;
      box-shadow: 0 4px 14px rgba(34,197,94,0.35);
    }
    #order-btn:hover, #order-btn-m:hover { filter: brightness(1.08); }
    .quality-btn.active {
      background: linear-gradient(135deg, rgba(242,202,80,0.3), rgba(212,175,55,0.15)) !important;
      border-color: #f2ca50 !important;
      color: #f2ca50 !important;
    }
    .swatch.active {
      outline: 3px solid #f2ca50 !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 10px rgba(242,202,80,0.5);
    }

  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top bar -->
  <header class="sticky top-0 z-40 bg-[#1c1b1b]/95 backdrop-blur border-b border-[#3d3530] px-4 py-3 flex items-center gap-3">
    <a href="/frames" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#2a2929] text-[#b7b0a8]">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <div class="flex-1 min-w-0">
      <h1 id="page-title" class="text-base sm:text-lg font-semibold text-[#f3de9a] truncate">Frame</h1>
      <p id="page-sub" class="text-xs text-[#b7b0a8] truncate"></p>
    </div>
  </header>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-4 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-10">

      <!-- LEFT: Preview -->
      <div class="space-y-4">
        <div id="preview-box" class="w-full bg-[#0a0a0a] rounded-xl border border-[#3d3530] flex items-center justify-center p-3 sm:p-6 min-h-[280px] sm:min-h-[420px]">
          <p class="text-[#b7b0a8] text-sm">Loading…</p>
        </div>
        <p class="text-center text-xs text-[#b7b0a8]">Seedha front view · Photo frame ke andar</p>
      </div>

      <!-- RIGHT: Options -->
      <div class="space-y-6 pb-28 lg:pb-8">
        <div>
          <div class="flex items-center gap-2 text-[#e9c176] text-sm mb-1">
            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">star</span>
            <span id="rating">4.5</span>
            <span class="text-[#b7b0a8]" id="reviews">· 100 reviews</span>
          </div>
          <div id="price-line" class="text-2xl font-bold text-[#e9c176]">—</div>
          <p id="desc" class="text-sm text-[#b7b0a8] mt-2 leading-relaxed"></p>
        </div>

        <!-- Photo upload on this page -->
        <div>
          <p class="text-xs uppercase tracking-widest text-[#b7b0a8] mb-2">Your Photo</p>
          <div class="flex flex-wrap gap-2 items-center">
            <label class="cursor-pointer px-4 py-2.5 rounded-lg border border-[#e9c176] text-[#e9c176] text-sm font-medium hover:bg-[#e9c176]/10">
              <input type="file" id="photo-input" accept="image/*" class="hidden"/>
              📷 Photo choose / change
            </label>
            <button type="button" id="clear-photo" class="hidden text-xs text-[#b7b0a8] underline">Remove photo</button>
          </div>
        </div>

        <!-- Quality -->
        <div>
          <p class="text-xs uppercase tracking-widest text-[#b7b0a8] mb-2">Photo Quality</p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2" id="quality-box">
            <!-- quality options from API -->
          </div>
        </div>

        <!-- Frame types (same size) -->
        <div>
          <p class="text-xs uppercase tracking-widest text-[#b7b0a8] mb-2">Frame Type</p>
          <div id="types-box" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
          <p id="type-label" class="text-sm text-[#b7b0a8] mt-2"></p>
        </div>

        <!-- Colours -->
        <div>
          <p class="text-xs uppercase tracking-widest text-[#b7b0a8] mb-2">Frame Colour</p>
          <div id="colours-box" class="flex flex-wrap gap-3"></div>
          <p id="colour-label" class="text-sm text-[#b7b0a8] mt-2"></p>
        </div>

        <!-- Desktop order btn -->
        <button id="order-btn" type="button" disabled class="hidden lg:block w-full py-4 bg-[#e9c176] text-[#241804] font-semibold rounded-lg hover:brightness-105 disabled:opacity-50 disabled:cursor-not-allowed">
          Continue to Order
        </button>
      </div>
    </div>
  </main>

  <!-- Mobile sticky order bar -->
  <div class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-[#1c1b1b] border-t border-[#3d3530] p-3 safe-bottom">
    <div class="flex items-center gap-3 max-w-6xl mx-auto">
      <div class="flex-1 min-w-0">
        <p class="text-xs text-[#b7b0a8]">Total</p>
        <p id="mobile-price" class="text-lg font-bold text-[#e9c176]">—</p>
      </div>
      <button id="order-btn-m" type="button" disabled class="px-6 py-3 bg-[#e9c176] text-[#241804] font-semibold rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">
        Continue to Order
      </button>
    </div>
  </div>

<script>
const PHOTO_KEY = "as_user_photo";
let allFrames = [];
let selected = null;
let userPhoto = null;
let qualityExtra = 0;
let selectedColour = { id: "gold", name: "Gold", hex: "#c9a227" };

const DEFAULT_COLOURS = [
  { id: "gold", name: "Gold", hex: "#c9a227" },
  { id: "brown", name: "Brown", hex: "#5c4033" },
  { id: "black", name: "Black", hex: "#1a1a1a" },
  { id: "white", name: "White", hex: "#f5f5f5" },
  { id: "silver", name: "Silver", hex: "#c0c0c0" },
  { id: "red", name: "Red", hex: "#8b1a1a" },
];

function qs(name) {
  return new URLSearchParams(location.search).get(name);
}

function formatPrice(n) {
  return "₹" + Math.round(Number(n) || 0);
}

function parseSize(s) {
  const m = String(s || "").match(/(\d+)\s*[x×]\s*(\d+)/i);
  if (!m) return { short: 8, long: 12 };
  let a = Number(m[1]), b = Number(m[2]);
  return { short: Math.min(a, b), long: Math.max(a, b) };
}

function displayDims(sizeStr) {
  const { short, long } = parseSize(sizeStr);
  // Prefer orientation from URL or default vertical (portrait) for 8x12 style
  const orient = qs("orient") || "vertical";
  if (orient === "horizontal") return { w: long, h: short, label: long + "x" + short };
  return { w: short, h: long, label: short + "x" + long };
}

function framePrice(f) {
  const price = Number(f.price) || 0;
  const discount = Number(f.discount) || 0;
  const finalPrice = discount > 0 ? Math.round(price * (1 - discount / 100)) : price;
  return { price, discount, finalPrice };
}

function buildPreview(frameImg, photoUrl) {
  const orient = qs("orient") || "vertical";
  const portrait = orient !== "horizontal";
  const ratio = portrait ? "2 / 3" : "3 / 2";
  // Mobile-safe: width + aspect-ratio only (no height:100% — collapses on mobile)
  const box = `position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:${ratio};background:#0a0a0a;overflow:hidden;`;
  // Photo inset tuned so photo sits inside frame border (~14–15%)
  const insetX = 14, insetY = 15;
  if (frameImg && photoUrl) {
    return `<div class="fp-box" style="${box}">
      <img class="fp-frame" src="${frameImg}" alt="frame" style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;display:block;" onerror="this.style.display='none'"/>
      <div class="fp-photo" style="position:absolute;left:${insetX}%;right:${insetX}%;top:${insetY}%;bottom:${insetY}%;overflow:hidden;z-index:2;">
        <img src="${photoUrl}" alt="photo" style="width:100%;height:100%;object-fit:cover;display:block;"/>
        <div class="glass-shine"></div>
      </div>
    </div>`;
  }
  if (frameImg) {
    return `<div class="fp-box" style="${box}">
      <img class="fp-frame" src="${frameImg}" alt="frame" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;" onerror="this.style.display='none'"/>
    </div>`;
  }
  if (photoUrl) {
    return `<div class="fp-box" style="${box}">
      <img src="${photoUrl}" alt="photo" style="width:100%;height:100%;object-fit:cover;display:block;"/>
      <div class="glass-shine"></div>
    </div>`;
  }
  return `<div style="${box}display:flex;align-items:center;justify-content:center;"><span style="color:#b7b0a8;font-size:13px;padding:16px;text-align:center;">Pehle frame dikhega · phir photo upload karein</span></div>`;
}

function updatePreview() {
  const box = document.getElementById("preview-box");
  if (!box || !selected) return;
  box.innerHTML = buildPreview(selected.image || "", userPhoto || "");
}

function updatePrice() {
  if (!selected) return;
  const { price, discount, finalPrice } = framePrice(selected);
  const total = finalPrice + qualityExtra;
  const html = formatPrice(total) +
    (discount > 0 ? ` <span class="text-base text-[#b7b0a8] line-through font-normal">${formatPrice(price)}</span> <span class="text-sm font-normal">(${discount}% OFF)</span>` : "");
  document.getElementById("price-line").innerHTML = html;
  document.getElementById("mobile-price").textContent = formatPrice(total);
}

function renderTypes() {
  const box = document.getElementById("types-box");
  if (!box || !selected) return;
  const types = allFrames.filter(f => f.size === selected.size);
  box.innerHTML = types.map(t => {
    const active = String(t.id) === String(selected.id);
    const img = t.image
      ? `<img src="${t.image}" class="w-full h-20 object-contain bg-black rounded" alt=""/>`
      : `<div class="w-full h-20 bg-[#2a2929] rounded flex items-center justify-center text-[#b7b0a8] text-xs">No img</div>`;
    return `<button type="button" class="type-card border-2 ${active ? "active border-[#e9c176]" : "border-[#3d3530]"} rounded-lg p-1.5 text-left" data-id="${t.id}">
      ${img}
      <span class="block text-[10px] mt-1 truncate text-center ${active ? "text-[#e9c176]" : "text-[#b7b0a8]"}">${t.title || t.size}</span>
    </button>`;
  }).join("");
  document.getElementById("type-label").textContent = "Selected: " + (selected.title || selected.size);
  box.querySelectorAll(".type-card").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = allFrames.find(x => String(x.id) === String(btn.dataset.id));
      if (!f) return;
      selected = f;
      history.replaceState(null, "", "?id=" + encodeURIComponent(f.id) + (qs("orient") ? "&orient=" + qs("orient") : ""));
      renderAll();
    });
  });
}

function renderColours() {
  const box = document.getElementById("colours-box");
  box.innerHTML = DEFAULT_COLOURS.map(c => {
    const active = selectedColour.id === c.id;
    return `<button type="button" class="swatch w-10 h-10 rounded-full border-2 border-[#3d3530] ${active ? "active" : ""}" data-id="${c.id}" data-name="${c.name}" data-hex="${c.hex}" style="background:${c.hex}" title="${c.name}"></button>`;
  }).join("");
  document.getElementById("colour-label").textContent = "Selected: " + selectedColour.name;
  box.querySelectorAll(".swatch").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedColour = { id: btn.dataset.id, name: btn.dataset.name, hex: btn.dataset.hex };
      renderColours();
    });
  });
}

function renderAll() {
  if (!selected) return;
  const dims = displayDims(selected.size);
  const { price, discount, finalPrice } = framePrice(selected);
  document.getElementById("page-title").textContent = dims.label + " · " + (selected.title || "Frame");
  document.getElementById("page-sub").textContent = selected.title || "";
  document.getElementById("desc").textContent =
    (selected.title || "Frame") + " — museum-quality moulding, precision cut glass. Size " + dims.label + ".";
  document.title = (selected.title || "Frame") + " · Aditya Studio";
  updatePrice();
  updatePreview();
  renderTypes();
  renderColours();
}

async function load() {
  const id = qs("id");
  try {
    const res = await fetch("/api/frames");
    const data = await res.json();
    const list = (data.frames || data || []);
    allFrames = (Array.isArray(list) ? list : []).filter(f => f.active !== false).map(f => ({
      ...f,
      discount: Number(f.discountPercent) || 0,
      image: f.imageData || f.imageUrl || ""
    }));
  } catch (e) {
    document.getElementById("preview-box").innerHTML = "<p class='text-red-400 p-4'>Frames load nahi hue. <a href='javascript:location.reload()' class='text-[#e9c176] underline'>Dobara try karein</a></p>";
    return;
  }

  selected = allFrames.find(f => String(f.id) === String(id)) || allFrames[0];
  if (!selected) {
    document.getElementById("preview-box").innerHTML = "<p class='text-[#b7b0a8] p-4'>Frame nahi mila. <a href='/frames' class='text-[#e9c176] underline'>Back</a></p>";
    return;
  }

  // Frame loaded successfully — now safe to allow ordering
  const obtn = document.getElementById("order-btn");
  const obtnM = document.getElementById("order-btn-m");
  if (obtn) obtn.disabled = false;
  if (obtnM) obtnM.disabled = false;

  // Photo from session (frames page se) or local
  try {
    userPhoto = sessionStorage.getItem(PHOTO_KEY) || localStorage.getItem(PHOTO_KEY) || null;
  } catch (e) {}

  renderAll();
}

// Photo input
document.getElementById("photo-input").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    userPhoto = ev.target.result;
    try {
      sessionStorage.setItem(PHOTO_KEY, userPhoto);
      // localStorage may fail for large images — ignore
      try { localStorage.setItem(PHOTO_KEY, userPhoto); } catch (_) {}
    } catch (_) {}
    document.getElementById("clear-photo").classList.remove("hidden");
    updatePreview();
  };
  reader.readAsDataURL(file);
});

document.getElementById("clear-photo").addEventListener("click", () => {
  userPhoto = null;
  try { sessionStorage.removeItem(PHOTO_KEY); localStorage.removeItem(PHOTO_KEY); } catch (_) {}
  document.getElementById("clear-photo").classList.add("hidden");
  updatePreview();
});

// Quality
document.querySelectorAll(".quality-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".quality-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    qualityExtra = Number(btn.dataset.extra) || 0;
    updatePrice();
  });
});

function goOrder() {
  if (!selected) {
    alert("Frame abhi load ho raha hai, thoda ruko aur dobara try karo. Agar problem bani rahe to page refresh karein.");
    return;
  }
  const { price, discount, finalPrice } = framePrice(selected);
  const total = finalPrice + qualityExtra;
  const qualityLabel = (document.querySelector(".quality-btn.active")?.dataset?.label)
    || (document.querySelector(".quality-btn.active")?.dataset?.id)
    || (window._selQualityId) || "Normal";
  const ctx = {
    frameId: selected.id,
    id: selected.id,
    frameName: selected.title || selected.size || "Frame",
    title: selected.title || "",
    name: selected.title || "",
    size: selected.size || "",
    price: finalPrice,
    mrp: price,
    discount: discount,
    finalPrice: finalPrice,
    qualityExtra: qualityExtra,
    quality: qualityLabel,
    qualityLabel: qualityLabel,
    qualityName: qualityLabel,
    colourName: (selectedColour && selectedColour.name) || "Gold",
    colourId: (selectedColour && selectedColour.id) || "gold",
    colourHex: (selectedColour && selectedColour.hex) || "#c9a227",
    orientation: qs("orient") || "vertical",
    total: total
  };
  try {
    const raw = JSON.stringify(ctx);
    sessionStorage.setItem("aditya_order_ctx", raw);
    localStorage.setItem("aditya_order_ctx", raw);
    if (userPhoto) {
      try { sessionStorage.setItem("as_user_photo", userPhoto); } catch (_) {}
    }
  } catch (_) {}

  // STRICT login — sirf 10-digit mobile wali session
  let loggedIn = false;
  try {
    const s = JSON.parse(localStorage.getItem("aditya_studio_session_v1") || "null");
    const mob = s ? String(s.mobile || s.phone || "").replace(/\D/g, "") : "";
    loggedIn = (mob.length === 10);
  } catch (e) { loggedIn = false; }

  if (!loggedIn) {
    try {
      localStorage.setItem("aditya_pending_order_flow", JSON.stringify({
        at: Date.now(),
        returnTo: "/place-order.html"
      }));
    } catch (e) {}
    // clear any fake/partial session
    try { localStorage.removeItem("aditya_studio_session_v1"); } catch (e) {}
    window.location.href = "/book-now.html?next=" + encodeURIComponent("/place-order.html") + "&from=order";
    return;
  }
  window.location.href = "/place-order.html";
}

document.getElementById("order-btn").addEventListener("click", goOrder);
document.getElementById("order-btn-m").addEventListener("click", goOrder);

if (sessionStorage.getItem(PHOTO_KEY) || localStorage.getItem(PHOTO_KEY)) {
  document.getElementById("clear-photo").classList.remove("hidden");
}

load();
</script>
</body>
</html>
