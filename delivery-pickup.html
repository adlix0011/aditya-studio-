<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickup Workflow</title><style>
:root{--pine:#143d34;--go:#229b5b;--ink:#13221e;--paper:#eef3ef;--line:#d5e2da;--amber:#e99b13}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,Arial;color:var(--ink)}main{max-width:460px;margin:auto;min-height:100vh;background:#fff}.top{background:var(--pine);color:#fff;padding:18px}.top a{color:#d8eee4;text-decoration:none;font-size:14px}.top h1{font-size:22px;margin:12px 0 2px}.top small{color:#b9d6c8}.steps{display:flex;gap:5px;margin-top:18px}.step{flex:1;text-align:center;font-size:10px;color:#b9ccc3}.step i{display:grid;place-items:center;margin:auto auto 5px;width:28px;height:28px;border-radius:50%;font-style:normal;background:#315b50;border:1px solid #5d887b}.step.on,.step.done{color:#fff}.step.on i{background:var(--amber);color:#4a2f00}.step.done i{background:var(--go)}.content{padding:18px}.card{border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}.route{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center;background:#edf5ef;border-radius:14px;padding:13px}.route small,.muted{color:#65766e;font-size:12px}.route b{display:block;font-size:14px;margin-top:3px}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef1ef}.item:last-child{border:0}.item input[type=checkbox]{width:20px;height:20px}.item .name{flex:1}.thumb{width:46px;height:46px;border-radius:10px;background:#edf2ee;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.photo{border:0;border-radius:10px;background:#e7f4eb;color:#17673e;padding:9px;font-weight:800}.photo input{display:none}input,select{width:100%;padding:12px;border:1px solid #bfd0c6;border-radius:10px;font:inherit;margin:6px 0 10px}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--pine);color:#fff;font-weight:900;font-size:15px}.btn:disabled{opacity:.45}.btn.go{background:var(--go)}.btn.amber{background:var(--amber);color:#472b00}.status{padding:12px;border-radius:12px;background:#e9f7ed;color:#17673e;font-weight:700;font-size:14px}.hidden{display:none}.bill-photo{display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #6ea984;border-radius:12px}.bill-photo .thumb{flex:none}.otp{letter-spacing:7px;font-size:21px;text-align:center}.error{color:#ba3828;font-size:13px;margin-top:8px}
</style></head><body><main><header class="top"><a href="/local-delivery.html">← My deliveries</a><h1 id="title">Pickup workflow</h1><small id="sub">Loading order…</small><div class="steps"><div class="step" id="s1"><i>1</i>Pickup</div><div class="step" id="s2"><i>2</i>Verify</div><div class="step" id="s3"><i>3</i>On route</div><div class="step" id="s4"><i>4</i>OTP</div></div></header><section class="content" id="app"></section></main><script>
const q=new URLSearchParams(location.search),id=q.get('order')||'';let session,order,screen='pickup',items=[],billPhoto='';try{session=JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null')}catch(_){session=null}const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,extra={}){const r=await fetch('/api/local-delivery/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:session?.mobile,sessionToken:session?.sessionToken,action,orderId:id,...extra})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'Update नहीं हुआ');return d}
async function load(){if(!session?.sessionToken||!id){location.replace('/local-delivery.html');return}const d=await call('list');order=(d.orders||[]).find(o=>String(o.id)===String(id));if(!order){$('app').innerHTML='<p class="error">Order उपलब्ध नहीं है।</p>';return}items=Array.isArray(order.pickupProgress)&&order.pickupProgress.length?order.pickupProgress:(order.lineItems?.length?order.lineItems:[{name:order.title,quantity:order.quantity||''}]).map(x=>({...x,done:false,photo:''}));$('title').textContent=order.title||'Pickup workflow';$('sub').textContent=(order.area||'Pickup')+' → '+(order.deliveryVillage||order.address||'Drop');if(order.status==='delivering')screen='route';render()}
function step(n){['s1','s2','s3','s4'].forEach((x,i)=>$(x).className='step '+(i+1<n?'done':i+1===n?'on':''))}
function route(){return '<div class="route"><div><small>Pickup</small><b>'+esc(order.area||'स्थान')+'</b></div><b>→</b><div><small>Drop</small><b>'+esc(order.deliveryVillage||order.address||'स्थान')+'</b></div></div>'}
function render(){if(!order)return;if(screen==='pickup'){step(1);$('app').innerHTML='<div class="card">'+route()+'<h3>Pickup के लिए तैयार</h3><p class="muted">दुकान पहुंचने के बाद सामान और bill verify करें।</p><button class="btn go" id="start">मैं pickup location पर पहुंच गया</button></div>';$('start').onclick=()=>{screen='verify';render()};return}if(screen==='verify'){step(2);$('app').innerHTML='<div class="card">'+route()+'<h3>सामान verify करें</h3><p class="muted">हर सामान को tick करें और उसकी photo लगाएं।</p>'+items.map((x,i)=>'<div class="item"><input type="checkbox" data-tick="'+i+'" '+(x.done?'checked':'')+'><div class="name"><b>'+esc(x.name)+'</b><br><small>'+esc(x.quantity||'')+'</small></div><div class="thumb">'+(x.photo?'<img src="'+esc(x.photo)+'">':'📦')+'</div><label class="photo">📷 Photo<input data-photo="'+i+'" type="file" accept="image/*" capture="environment"></label></div>').join('')+'<button class="btn" id="savePickup">✓ Pickup update</button></div><div class="card hidden" id="billCard"><h3>Bill verify करें</h3><input id="amount" type="number" min="0" value="'+Number(order.items||0)+'" placeholder="Actual bill amount"><label class="bill-photo"><div class="thumb" id="billThumb">'+(billPhoto?'<img src="'+esc(billPhoto)+'">':'🧾')+'</div><span>Bill photo लगाएं</span><input id="billInput" type="file" accept="image/*" capture="environment"></label><button class="btn amber" id="sendBill">🧾 Bill भेजें</button></div>';document.querySelectorAll('[data-tick]').forEach(x=>x.onchange=()=>{items[x.dataset.tick].done=x.checked;toggleBill()});document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=()=>upload(x.files[0],Number(x.dataset.photo)));$('savePickup').onclick=savePickup;$('billInput').onchange=()=>uploadBill($('billInput').files[0]);$('sendBill').onclick=sendBill;toggleBill();return}if(screen==='route'){step(3);$('app').innerHTML='<div class="card">'+route()+'<div class="status">🚚 Delivery चल रही है</div><p class="muted">Customer के सामान receive करने और OTP बनाने का इंतजार है।</p><button class="btn" id="otpPage">🔐 OTP verify</button></div>';$('otpPage').onclick=()=>{screen='otp';render()};return}step(4);$('app').innerHTML='<div class="card"><h3>🔐 Delivery OTP</h3><p class="muted">Customer से 6 digit OTP लेकर भरें।</p><input class="otp" id="otp" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="btn go" id="verify">✓ Delivery complete</button><div class="error" id="err"></div></div>';$('verify').onclick=verifyOtp()}
function toggleBill(){const ok=items.length&&items.every(x=>x.done&&x.photo);$('billCard').classList.toggle('hidden',!ok)}
async function upload(file,i){if(!file)return;try{const raw=await read(file),r=await fetch('/api/local-delivery/photo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:session.mobile,sessionToken:session.sessionToken,photo:raw})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message);items[i].photo=d.url;items[i].done=true;await call('pickup-progress',{items});order.pickupProgress=items;render()}catch(e){alert(e.message||'Photo upload नहीं हुई')}}
async function uploadBill(file){if(!file)return;try{const raw=await read(file),r=await fetch('/api/local-delivery/photo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:session.mobile,sessionToken:session.sessionToken,photo:raw})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message);billPhoto=d.url;render()}catch(e){alert(e.message||'Bill photo upload नहीं हुई')}}
const read=f=>new Promise((a,b)=>{if(f.size>10*1024*1024)return b(Error('10 MB तक की photo चुनें'));const r=new FileReader();r.onload=()=>a(r.result);r.onerror=()=>b(Error('Photo नहीं पढ़ी जा सकी'));r.readAsDataURL(f)});
async function savePickup(){try{await call('pickup-progress',{items});$('savePickup').textContent='✓ Pickup update हो गया';toggleBill()}catch(e){alert(e.message)}}async function sendBill(){try{if(!billPhoto)throw Error('पहले bill photo लगाएं');await call('pickup-progress',{items});order.pickupProgress=items;await call('actual-bill-request',{amount:Math.round(Number($('amount').value)),photo:billPhoto});$('billCard').innerHTML='<div class="status">⏳ Bill customer approval के लिए भेज दिया गया</div><button class="btn go" id="goRoute">Delivery शुरू करें</button>';$('goRoute').onclick=startRoute}catch(e){alert(e.message)}}async function startRoute(){const minutes=Number(prompt('Estimated delivery time (minutes)','15'));if(!minutes)return;try{await call('delivery-start',{minutes});screen='route';order.status='delivering';render()}catch(e){alert(e.message)}}async function verifyOtp(){try{await call('delivery-otp-verify',{code:$('otp').value.replace(/\D/g,'')});$('app').innerHTML='<div class="card"><div class="status">🎉 Delivery successfully complete</div><p>Payment wallet में भेज दिया गया है।</p><a class="btn go" href="/local-delivery.html">My deliveries</a></div>'}catch(e){$('err').textContent=e.message}}load();setInterval(()=>{if(!document.hidden&&order&&order.status==='delivering')load().catch(()=>{})},3000);
</script></body></html>
