<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Money · Aditya Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2c2110,#0f0c09 60%);color:#f4ead6;font-family:Arial,sans-serif;padding:20px}.card{max-width:430px;margin:20px auto;padding:22px;border:1px solid rgba(212,175,55,.42);border-radius:20px;background:rgba(26,19,10,.94);box-shadow:0 15px 36px #0008}h1{margin:0;color:#f3de9a;font-size:26px}.sub{font-size:13px;color:#b7a480;line-height:1.5}.back{color:#f3de9a;text-decoration:none;font-weight:bold;font-size:13px}.qr{width:min(250px,75vw);display:block;margin:16px auto;border-radius:15px;border:5px solid #fff;background:#fff}.upi{padding:10px;border-radius:9px;text-align:center;background:#102e46;border:1px solid #38bdf8;color:#bae6fd;font-weight:bold;word-break:break-all}label{display:block;color:#f3de9a;font-size:13px;margin:16px 0 6px;font-weight:bold}input{width:100%;padding:13px;border-radius:10px;border:1px solid #7d6528;background:#0e0b08;color:#fff;font-size:16px}button,.help-whatsapp,.success-back{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-weight:bold;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;display:block}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.45}.ok{display:block;background:#14532d;color:#dcfce7;border:1px solid #4ade80}.err{display:block;background:#571b22;color:#fecaca;border:1px solid #ef4444}.pending{margin-top:12px;color:#bae6fd;font-size:12px;text-align:center}.success-screen{padding:28px 6px 8px;text-align:center}.success-screen h1{color:#86efac;font-size:24px}.success-screen p{color:#67e8f9;line-height:1.55}.loading-ring{width:52px;height:52px;margin:20px auto 12px;border:5px solid rgba(34,197,94,.2);border-top-color:#4ade80;border-right-color:#38bdf8;border-radius:50%;animation:spin .9s linear infinite;box-shadow:0 0 17px rgba(74,222,128,.5)}@keyframes spin{to{transform:rotate(360deg)}}.wait-label{color:#facc15!important;font-weight:800;margin:3px 0!important}.wait-timer{color:#f472b6;font-size:26px;font-weight:900;letter-spacing:.08em;margin:4px 0 12px}.help-whatsapp{background:linear-gradient(135deg,#25d366,#128c3e);margin-top:26px}.success-back{background:linear-gradient(135deg,#a855f7,#ec4899 52%,#f59e0b);margin-top:12px;box-shadow:0 0 15px rgba(236,72,153,.3)}
</style></head><body><main class="card"><a class="back" id="backLink" href="/">← Back</a><h1>💳 Add Money</h1><p class="sub">पहले QR से payment करें, फिर UTR या screenshot submit करें। रकम पहले sky-blue pending रहेगी; admin verify करने पर ही golden usable wallet balance बनेगी।</p><img class="qr" src="/payment-qr.png" alt="Payment QR"><div class="upi">UPI: BHARATPE.9JOB0S0Y6I253580@unitype</div><form id="topupForm"><label>कितना पैसा add करना है?</label><input id="amount" type="number" min="1" max="100000" placeholder="जैसे: 500" required><label>UTR / Transaction ID</label><input id="utr" maxlength="40" placeholder="कम से कम 6 characters"><label>या Payment Screenshot</label><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><button id="submitBtn">Payment Submit करें</button></form><div id="msg" class="msg"></div><p class="pending">⏳ Admin verification के बाद ही पैसा order में use होगा।</p></main><script>
const session=JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null');if(session&&session.pin)delete session.pin;if(session&&session.mobile&&session.sessionToken){localStorage.setItem('aditya_studio_session_v1',JSON.stringify(session));localStorage.setItem('aditya_studio_persistent_login_v2',JSON.stringify(session));}if(!session||!session.sessionToken){location.href='/book-now?auth=login'}
window.addEventListener('storage',function(event){if(event.key==='aditya_studio_session_v1'&&!event.newValue){location.replace('/')}});
const msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err')}
const returnUrl=(()=>{try{const ref=document.referrer;return ref&&new URL(ref).origin===location.origin?ref:'/'}catch(_){return '/'}})();
document.getElementById('backLink').addEventListener('click',function(e){e.preventDefault();location.href=returnUrl});
function showSuccess(){document.querySelector('.card').innerHTML='<div class="success-screen"><h1>✅ Recharge submitted successfully</h1><div class="loading-ring" aria-label="Verification pending"></div><p class="wait-label">Please wait — admin verification pending</p><div class="wait-timer" id="waitTimer">10:00</div><p>Verification complete hone par amount wallet me automatically add ho jayega.</p></div><a class="help-whatsapp" href="https://wa.me/917024230041?text=Hello%2C%20maine%20wallet%20recharge%20submit%20kiya%20hai.%20Verification%20me%20help%20chahiye." target="_blank" rel="noopener">💬 Any query? Help on WhatsApp</a><a class="success-back" href="'+returnUrl+'">← Back to previous page</a>';let left=600;const timer=document.getElementById('waitTimer');const tick=()=>{const min=Math.floor(left/60),sec=left%60;timer.textContent=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(left-->0)setTimeout(tick,1000)};tick()}
document.getElementById('topupForm').addEventListener('submit',async e=>{e.preventDefault();const amount=+document.getElementById('amount').value,utr=document.getElementById('utr').value.trim(),file=document.getElementById('proof').files[0];if(file&&file.size>1024*1024)return show('Screenshot 1MB से छोटा रखें');let proof='';if(file)proof=await new Promise((a,b)=>{const r=new FileReader();r.onload=()=>a(String(r.result||''));r.onerror=b;r.readAsDataURL(file)});const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Submit हो रहा है…';try{const r=await fetch('/api/wallet/topup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:session.sessionToken,amount,utr,proof})}),d=await r.json();if(!d.ok)throw Error(d.message);showSuccess()}catch(x){show(x.message||'Network error');b.disabled=false;b.textContent='Payment Submit करें'}})
</script></body></html>
