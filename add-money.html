<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Money · Aditya Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2c2110,#0f0c09 60%);color:#f4ead6;font-family:Arial,sans-serif;padding:20px}.card{max-width:430px;margin:20px auto;padding:22px;border:1px solid rgba(212,175,55,.42);border-radius:20px;background:rgba(26,19,10,.94);box-shadow:0 15px 36px #0008}h1{margin:0;color:#f3de9a;font-size:26px}.sub{font-size:13px;color:#b7a480;line-height:1.5}.back{color:#f3de9a;text-decoration:none;font-weight:bold;font-size:13px}.qr{width:min(250px,75vw);display:block;margin:16px auto;border-radius:15px;border:5px solid #fff;background:#fff}.upi{padding:10px;border-radius:9px;text-align:center;background:#102e46;border:1px solid #38bdf8;color:#bae6fd;font-weight:bold;word-break:break-all}label{display:block;color:#f3de9a;font-size:13px;margin:16px 0 6px;font-weight:bold}input{width:100%;padding:13px;border-radius:10px;border:1px solid #7d6528;background:#0e0b08;color:#fff;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.45}.ok{display:block;background:#14532d;color:#dcfce7;border:1px solid #4ade80}.err{display:block;background:#571b22;color:#fecaca;border:1px solid #ef4444}.pending{margin-top:12px;color:#bae6fd;font-size:12px;text-align:center}
</style></head><body><main class="card"><a class="back" href="/">← Back to Home</a><h1>💳 Add Money</h1><p class="sub">पहले QR से payment करें, फिर UTR या screenshot submit करें। रकम पहले sky-blue pending रहेगी; admin verify करने पर ही golden usable wallet balance बनेगी।</p><img class="qr" src="/payment-qr.png" alt="Payment QR"><div class="upi">UPI: BHARATPE.9JOB0S0Y6I253580@unitype</div><form id="topupForm"><label>कितना पैसा add करना है?</label><input id="amount" type="number" min="1" max="100000" placeholder="जैसे: 500" required><label>UTR / Transaction ID</label><input id="utr" maxlength="40" placeholder="कम से कम 6 characters"><label>या Payment Screenshot</label><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><button id="submitBtn">Payment Submit करें</button></form><div id="msg" class="msg"></div><p class="pending">⏳ Admin verification के बाद ही पैसा order में use होगा।</p></main><script>
const session=JSON.parse(localStorage.getItem('aditya_studio_session_v1')||'null');if(!session||!session.sessionToken){location.href='/book-now?auth=login'}
window.addEventListener('storage',function(event){if(event.key==='aditya_studio_session_v1'&&!event.newValue){location.replace('/')}});
const msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err')}
document.getElementById('topupForm').addEventListener('submit',async e=>{e.preventDefault();const amount=+document.getElementById('amount').value,utr=document.getElementById('utr').value.trim(),file=document.getElementById('proof').files[0];if(file&&file.size>1024*1024)return show('Screenshot 1MB से छोटा रखें');let proof='';if(file)proof=await new Promise((a,b)=>{const r=new FileReader();r.onload=()=>a(String(r.result||''));r.onerror=b;r.readAsDataURL(file)});const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Submit हो रहा है…';try{const r=await fetch('/api/wallet/topup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:session.sessionToken,amount,utr,proof})}),d=await r.json();if(!d.ok)throw Error(d.message);show('✅ '+d.message+' Request: '+d.topupId,true);b.textContent='Submitted';setTimeout(()=>location.href='/',1500)}catch(x){show(x.message||'Network error');b.disabled=false;b.textContent='Payment Submit करें'}})
</script></body></html>
