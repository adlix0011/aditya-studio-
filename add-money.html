<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Money · Aditya Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2c2110,#0f0c09 60%);color:#f4ead6;font-family:Arial,sans-serif;padding:20px}.card{max-width:430px;margin:20px auto;padding:22px;border:1px solid rgba(212,175,55,.42);border-radius:20px;background:rgba(26,19,10,.94);box-shadow:0 15px 36px #0008}h1{margin:0;color:#f3de9a;font-size:26px}.sub{font-size:13px;color:#b7a480;line-height:1.5}.back{color:#f3de9a;text-decoration:none;font-weight:bold;font-size:13px}.qr{width:min(250px,75vw);display:block;margin:16px auto;border-radius:15px;border:5px solid #fff;background:#fff}.upi{padding:10px;border-radius:9px;text-align:center;background:#102e46;border:1px solid #38bdf8;color:#bae6fd;font-weight:bold;word-break:break-all}label{display:block;color:#f3de9a;font-size:13px;margin:16px 0 6px;font-weight:bold}input{width:100%;padding:13px;border-radius:10px;border:1px solid #7d6528;background:#0e0b08;color:#fff;font-size:16px}button,.help-whatsapp,.success-back{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-weight:bold;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;display:block}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.45}.ok{display:block;background:#14532d;color:#dcfce7;border:1px solid #4ade80}.err{display:block;background:#571b22;color:#fecaca;border:1px solid #ef4444}.pending{margin-top:12px;color:#bae6fd;font-size:12px;text-align:center}.verify{margin:18px 0;padding:14px;border:1px solid #38bdf8;border-radius:13px;background:#102e46}.verify strong{color:#bae6fd}.verify p{font-size:12px;color:#dbeafe;line-height:1.45}.verify .row{display:flex;gap:8px}.verify .row button{width:auto;white-space:nowrap;margin:0;padding:12px}.verify input{margin:8px 0}.success-screen{padding:28px 6px 8px;text-align:center}.success-screen h1{color:#86efac;font-size:24px}.success-screen p{color:#67e8f9;line-height:1.55}.loading-ring{width:52px;height:52px;margin:20px auto 12px;border:5px solid rgba(34,197,94,.2);border-top-color:#4ade80;border-right-color:#38bdf8;border-radius:50%;animation:spin .9s linear infinite;box-shadow:0 0 17px rgba(74,222,128,.5)}@keyframes spin{to{transform:rotate(360deg)}}.wait-label{color:#facc15!important;font-weight:800;margin:3px 0!important}.wait-timer{color:#f472b6;font-size:26px;font-weight:900;letter-spacing:.08em;margin:4px 0 12px}.help-whatsapp{background:linear-gradient(135deg,#25d366,#128c3e);margin-top:26px}.success-back{background:linear-gradient(135deg,#a855f7,#ec4899 52%,#f59e0b);margin-top:12px;box-shadow:0 0 15px rgba(236,72,153,.3)}
</style></head><body><main class="card"><a class="back" id="backLink" href="/local-delivery">← Back</a><h1>💳 Add Money</h1><p class="sub">QR से payment करें, फिर UTR या screenshot submit करें। Admin verification के बाद रकम wallet में आएगी।</p><img class="qr" src="/payment-qr.png" alt="Payment QR"><div class="upi">UPI: BHARATPE.9JOB0S0Y6I253580@unitype</div><div id="verifyBox" class="verify" hidden></div><form id="topupForm"><label>कितना पैसा add करना है?</label><input id="amount" type="number" min="1" max="100000" placeholder="जैसे: 500" required><label>UTR / Transaction ID</label><input id="utr" maxlength="40" placeholder="कम से कम 6 characters"><label>या Payment Screenshot</label><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><button id="submitBtn">Payment Submit करें</button></form><div id="msg" class="msg"></div><p class="pending">⏳ Admin verification के बाद ही पैसा order में use होगा।</p></main><script>
let session;try{session=JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null')}catch(_){session=null}if(session&&session.pin)delete session.pin;
const msg=document.getElementById('msg'),form=document.getElementById('topupForm'),verifyBox=document.getElementById('verifyBox');
const returnUrl=(()=>{try{const v=new URLSearchParams(location.search).get('return');return v&&v.startsWith('/')&&!v.startsWith('//')?v:'/local-delivery'}catch(_){return '/local-delivery'}})();document.getElementById('backLink').href=returnUrl;
function saveSession(){localStorage.setItem('aditya_studio_session_v1',JSON.stringify(session));localStorage.setItem('aditya_studio_persistent_login_v2',JSON.stringify(session))}function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err')}
async function json(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'Request पूरा नहीं हुआ');return d}
function showVerify(text){form.hidden=true;verifyBox.hidden=false;verifyBox.innerHTML='<strong>📱 Mobile verification जरूरी है</strong><p>'+text+'</p><div class="row"><input id="verifyOtp" inputmode="numeric" maxlength="6" placeholder="6 अंकों का OTP"><button type="button" id="verifyOtpBtn">OTP Verify</button></div><button type="button" id="requestOtpBtn">OTP Request करें</button><div id="verifyMsg" class="pending"></div>';const out=document.getElementById('verifyMsg');document.getElementById('requestOtpBtn').onclick=async()=>{try{const d=await json('/api/request-spin-otp',{mobile:session.mobile,sessionToken:session.sessionToken});out.textContent=d.alreadyVerified?'पहले से verified है।':'OTP request भेज दिया गया है। WhatsApp पर OTP मिलने के बाद ऊपर भरें।'}catch(e){out.textContent=e.message}};document.getElementById('verifyOtpBtn').onclick=async()=>{const otp=document.getElementById('verifyOtp').value.trim();if(!/^\d{6}$/.test(otp)){out.textContent='6 अंकों का OTP भरें।';return}try{const d=await json('/api/verify-spin-otp',{mobile:session.mobile,sessionToken:session.sessionToken,otp});session={...session,...d,mobileVerified:true};saveSession();verifyBox.hidden=true;form.hidden=false;show('✓ Mobile verified. अब QR payment submit करें।',true)}catch(e){out.textContent=e.message}}}
async function checkVerification(){if(!session||!session.sessionToken||!session.mobile){location.replace('/?auth=login');return}saveSession();try{const d=await json('/api/restore-session',{mobile:session.mobile,sessionToken:session.sessionToken});if(d.mobileVerified){session={...session,...d,mobileVerified:true};saveSession();return}showVerify('Recharge करने से पहले अपना मोबाइल OTP से verify करें।')}catch(_){showVerify('Verification status नहीं मिला। OTP request करके verify करें।')}}
let rechargePollTimer=null;
function goToWallet(){
  try{sessionStorage.setItem('local_delivery_view_v1',JSON.stringify({tab:'post',active:null}))}catch(_){}
  location.replace('/local-delivery');
}
function rechargeApproved(amount,balance){
  clearInterval(rechargePollTimer);
  document.querySelector('.card').innerHTML='<div class="success-screen"><h1>✅ Recharge verified</h1><p class="wait-label">₹'+amount+' wallet में add हो गया</p><div class="wait-timer">₹'+Number(balance||0).toLocaleString('en-IN')+'</div><p>आपकी भरी हुई post सुरक्षित है।</p><button class="success-back" id="openWalletBtn" type="button">← Filled Post पर वापस जाएं</button></div>';
  document.getElementById('openWalletBtn').onclick=goToWallet;
  setTimeout(goToWallet,1800);
}
function rechargeRejected(amount){
  clearInterval(rechargePollTimer);
  document.querySelector('.card').innerHTML='<div class="success-screen"><h1 style="color:#fca5a5">Recharge verify नहीं हुआ</h1><p>₹'+amount+' wallet में add नहीं हुआ। कृपया Help on WhatsApp से संपर्क करें।</p></div><a class="help-whatsapp" href="https://wa.me/917024230041?text=Hello%2C%20mera%20wallet%20recharge%20verify%20nahi%20hua." target="_blank" rel="noopener">💬 Help on WhatsApp</a><a class="success-back" href="'+returnUrl+'">← Back to Local Delivery</a>';
}
async function checkRechargeStatus(topupId,amount){
  try{
    const data=await json('/api/wallet/history',{sessionToken:session.sessionToken});
    const row=(data.walletHistory||[]).find(item=>String(item.ref||'')===String(topupId));
    if(!row)return;
    if(row.type==='approved'){
      session={...session,walletBalance:Number(data.walletBalance)||0};saveSession();
      rechargeApproved(amount,data.walletBalance);
    }else if(row.type==='rejected') rechargeRejected(amount);
  }catch(_){}
}
function showSuccess(topupId,amount){
  document.querySelector('.card').innerHTML='<div class="success-screen"><h1>✅ Recharge submitted successfully</h1><div class="loading-ring"></div><p class="wait-label">Admin verification का इंतज़ार है</p><div class="wait-timer" id="waitTimer">10:00</div><p>10 मिनट के अंदर verification हो सकता है। Verify होते ही timer हटेगा और wallet अपने-आप खुलेगा।</p></div><a class="help-whatsapp" href="https://wa.me/917024230041?text=Hello%2C%20maine%20wallet%20recharge%20submit%20kiya%20hai." target="_blank" rel="noopener">💬 Any query? Help on WhatsApp</a><a class="success-back" href="'+returnUrl+'">← Back to Local Delivery</a>';
  const deadline=Date.now()+10*60*1000,timer=document.getElementById('waitTimer');
  const tick=()=>{const remaining=Math.max(0,deadline-Date.now()),seconds=Math.ceil(remaining/1000);timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
  tick();rechargePollTimer=setInterval(()=>{tick();checkRechargeStatus(topupId,amount)},2500);
  checkRechargeStatus(topupId,amount);
}
form.addEventListener('submit',async e=>{e.preventDefault();const amount=+document.getElementById('amount').value,utr=document.getElementById('utr').value.trim(),file=document.getElementById('proof').files[0];if(file&&file.size>1024*1024)return show('Screenshot 1MB से छोटा रखें');let proof='';if(file)proof=await new Promise((a,b)=>{const r=new FileReader();r.onload=()=>a(String(r.result||''));r.onerror=b;r.readAsDataURL(file)});const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Submit हो रहा है…';try{const result=await json('/api/wallet/topup',{sessionToken:session.sessionToken,amount,utr,proof});showSuccess(result.topupId,amount)}catch(x){show(x.message||'Network error');b.disabled=false;b.textContent='Payment Submit करें'}});checkVerification();
</script></body></html>
