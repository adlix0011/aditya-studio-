(()=>{const previousRender=render;render=function(){previousRender();if(tab!=='receive'||active)return;const host=document.querySelector('.content');if(!host)return;const posts=(state.orders||[]).filter(o=>o.kind!=='delivery-service'&&['open','chat'].includes(o.status));host.innerHTML='<section class="delivery-receive-page"><div class="market-list">'+(posts.map(o=>{const items=(o.lineItems||[]).map(x=>String(x.name||'')+' '+String(x.quantity||'')).filter(Boolean).join(', ')||String(o.quantity||'Quantity नहीं दी');const due=o.neededBy?new Date(o.neededBy).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}):'जल्दी चाहिए';return '<article class="market-card tone-amber"><div class="row"><span class="badge">खुली मांग</span><strong style="color:#6ee7b7">'+money(Number(o.fee||0))+' कमाई</strong></div><h3 style="margin:12px 0 7px">'+esc(o.title||'Delivery request')+'</h3><p class="muted" style="margin:0 0 8px">📦 सामान: '+esc(items)+'</p><p class="muted" style="margin:0 0 8px">📍 '+esc(o.area||'Pickup')+' → '+esc(o.deliveryVillage||o.address||'Delivery location')+'</p><p class="muted" style="margin:0 0 13px">⏰ कब तक चाहिए: '+esc(due)+'</p><button class="btn accept-wide" data-go="orders">देखें और स्वीकार करें →</button></article>'}).join('')||'<div class="empty">अभी कोई delivery request उपलब्ध नहीं है।</div>')+'</div></section>';};})();
</script></body></html>
