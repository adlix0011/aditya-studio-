<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Adjust · Aditya Studio</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#100d09;color:#f4eadc;font-family:Arial,sans-serif}.gold{color:#e5bd5b}.panel{background:#1b1610;border:1px solid rgba(229,189,91,.42)}#stage{width:min(100%,300px);aspect-ratio:3/4;position:relative;overflow:hidden;border:3px solid #e5bd5b;border-radius:14px;background:#050505;touch-action:none}#photo{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;will-change:transform;transform:translate3d(-50%,-50%,0)}.choice{border:1px solid #655b50;background:#15110d;color:#ded1c2}.choice.active{border-color:#f4c95d;background:rgba(229,189,91,.18);color:#f4c95d}input{accent-color:#e5bd5b}@media(max-width:560px){#stage{width:145px}.editor{grid-template-columns:145px minmax(0,1fr)!important;gap:12px!important}.actions button{font-size:.72rem;padding:.55rem .2rem}}</style></head><body><header class="border-b border-[#5d4c2b] px-4 py-4 flex justify-between"><a href="/frames" class="gold text-sm">← वापस</a><b class="gold">Aditya Studio</b><span></span></header><main class="max-w-2xl mx-auto p-4"><section class="panel rounded-2xl p-4 sm:p-6"><h1 class="text-xl font-bold gold text-center">अपनी Photo Adjust करें</h1><p class="text-center text-sm text-stone-300 mt-2">Live preview में frame का exact हिस्सा देखें।</p><div id="missing" class="hidden mt-6 text-center text-red-200">पहले Frames page से photo upload करें।</div><div id="edit" class="mt-5"><div class="editor grid grid-cols-[minmax(145px,300px)_minmax(0,1fr)] gap-5 items-start"><div class="flex flex-col items-center"><div id="stage"><img id="photo" alt="Live frame preview"><span class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-black/70 px-2 py-1 rounded-full text-[10px] gold whitespace-nowrap">Drag to move</span></div><p class="text-xs text-stone-400 mt-2">Live frame preview</p></div><div class="space-y-4"><div><div class="flex justify-between text-sm mb-1"><label>Zoom</label><span id="zv" class="gold">100%</span></div><input id="zoom" class="w-full" type="range" min="100" max="300" value="100"></div><div class="actions grid grid-cols-3 gap-2"><button id="fit" class="choice rounded-lg">Fit</button><button id="fill" class="choice rounded-lg">Fill</button><button id="reset" class="choice rounded-lg">Reset</button></div><p class="text-xs text-stone-400">Zoom और drag से photo को सही जगह रखें।</p></div></div><div class="mt-6"><p class="text-center text-xs tracking-widest text-stone-400 mb-3">FRAME ORIENTATION</p><div class="grid grid-cols-2 gap-3"><button class="choice rounded-xl p-3" data-o="vertical">▯<b class="block">Vertical</b><small>खड़ा frame</small></button><button class="choice rounded-xl p-3" data-o="horizontal">▭<b class="block">Horizontal</b><small>लेटा frame</small></button></div></div><button id="done" class="mt-6 w-full rounded-xl bg-gradient-to-r from-yellow-600 to-yellow-400 py-3 font-bold text-[#211500]">Done — Frames देखें</button></div></section></main><script>const src=sessionStorage.getItem('as_user_photo'),box=document.getElementById('edit');if(!src){box.classList.add('hidden');document.getElementById('missing').classList.remove('hidden')}else{let o=sessionStorage.getItem('as_photo_orientation')==='horizontal'?'horizontal':'vertical',z=Number(sessionStorage.getItem('as_photo_zoom'))||1,x=Number(sessionStorage.getItem('as_photo_pan_x')),y=Number(sessionStorage.getItem('as_photo_pan_y'));if(!Number.isFinite(x))x=.5;if(!Number.isFinite(y))y=.5;const s=document.getElementById('stage'),im=document.getElementById('photo'),sl=document.getElementById('zoom');im.src=src;let raf=0;function draw(){s.style.aspectRatio=o==='horizontal'?'4 / 3':'3 / 4';let sw=s.clientWidth||250,sh=s.clientHeight||330,ia=(im.naturalWidth||1)/(im.naturalHeight||1),sa=sw/sh,w,h;if(ia>sa){h=sh;w=h*ia}else{w=sw;h=w/ia}w*=z;h*=z;let dx=Math.max(0,(w-sw)/2)*(1-2*x),dy=Math.max(0,(h-sh)/2)*(1-2*y);im.style.width=w+'px';im.style.height=h+'px';im.style.transform='translate3d(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px),0)';sl.value=z*100;document.getElementById('zv').textContent=Math.round(z*100)+'%';document.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('active',b.dataset.o===o))}function q(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}im.onload=draw;sl.oninput=()=>{z=sl.value/100;draw()};fit.onclick=()=>{z=1;x=y=.5;draw()};fill.onclick=()=>{z=1.35;x=y=.5;draw()};reset.onclick=()=>{z=1;x=y=.5;draw()};document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{o=b.dataset.o;draw()});let drag=0,lx=0,ly=0;s.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY;s.setPointerCapture(e.pointerId)};s.onpointermove=e=>{if(!drag)return;x=Math.max(0,Math.min(1,x-(e.clientX-lx)/(s.clientWidth||1)*.55/z));y=Math.max(0,Math.min(1,y-(e.clientY-ly)/(s.clientHeight||1)*.55/z));lx=e.clientX;ly=e.clientY;q()};s.onpointerup=s.onpointercancel=()=>drag=0;done.onclick=()=>{sessionStorage.setItem('as_photo_orientation',o);sessionStorage.setItem('as_photo_zoom',z);sessionStorage.setItem('as_photo_pan_x',x);sessionStorage.setItem('as_photo_pan_y',y);location.href='/frames'}}</script></body></html>
