<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Payment</title><link rel="stylesheet" href="/mobile-design.css?v=payment181"><style>body{margin:0;background:#080d1b;color:#eef2ff;font-family:Arial,sans-serif}.payment-page{max-width:620px;margin:auto;padding:22px 16px 45px}.payment-top{display:flex;justify-content:space-between;align-items:center}.payment-top a{color:#c4b5fd;text-decoration:none}.payment-card{margin-top:18px;padding:19px;border:1px solid #334155;border-radius:18px;background:linear-gradient(145deg,#121d37,#0d1427)}.price-card{text-align:center;border-color:#22c55e}.price-card span{display:block;color:#a7f3d0}.price-card strong{display:block;font-size:38px;color:#fef08a;margin:7px 0}.timer{margin-top:14px;padding:12px;border-radius:12px;background:linear-gradient(90deg,#581c87,#be185d);font-size:19px;font-weight:900;color:#fff;text-align:center}.wallet-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wallet-amount{font-size:23px;color:#5eead4;font-weight:900}.pay-option{display:flex;align-items:center;gap:12px;margin-top:14px;padding:16px;border:2px solid #334155;border-radius:14px;background:#111b31;cursor:pointer}.pay-option.selected{border-color:#22c55e;background:#0b3527}.pay-option.disabled{opacity:.58}.pay-option input{width:21px;height:21px;accent-color:#22c55e}.pay-option b,.pay-option span{display:block}.pay-option span{font-size:12px;color:#b9c6da;margin-top:4px}.add-money{margin-left:auto;padding:9px 11px;border-radius:9px;background:#f59e0b;color:#1c1200;font-weight:900;text-decoration:none}.cod-warning{margin-top:14px;padding:15px;border-radius:12px;background:#422006;border:1px solid #f59e0b;color:#fef3c7}.choice-row{display:flex;gap:10px}.choice-row button{flex:1;padding:11px;border:0;border-radius:9px;font-weight:900}.yes{background:#22c55e;color:#06210f}.no{background:#334155;color:#fff}.confirm{width:100%;padding:15px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#2563eb,#059669);color:#fff;font-size:17px;font-weight:900}.message{min-height:22px;margin-top:12px;color:#fca5a5;font-weight:700}.checkout-note{color:#a8b5ca;font-size:12px;line-height:1.5}</style></head><body><main class="payment-page"><div class="payment-top"><a id="formBack" href="/local-delivery.html">← Form पर वापस</a><b>SECURE ORDER PAYMENT</b></div><section class="payment-card price-card"><span>इस order की कुल रकम</span><strong id="price">₹0</strong><small id="breakdown"></small><div class="timer">⏳ Payment समय: <span id="timer">05:00</span></div></section><section class="payment-card"><div class="wallet-row"><div><b>👛 Wallet payment</b><span class="checkout-note">Wallet balance</span></div><div class="wallet-amount" id="wallet">₹0</div></div><label class="pay-option" id="walletOption"><input type="radio" name="method" value="wallet"><div><b>Wallet से भुगतान करें</b><span>पूरा amount wallet से pay होगा।</span></div><a id="addMoney" class="add-money" href="/add-money?return=%2Flocal-delivery">Add Money</a></label><label class="pay-option" id="cashOption"><input type="radio" name="method" value="cash"><div><b>💵 Cash on Delivery</b><span id="cashText">घर पहुंचने पर delivery boy को सामान की पूरी payment दें।</span></div></label><div id="codBox"></div><div id="message" class="message"></div><button id="confirm" class="confirm">Order confirm करें</button></section></main><script>const KEY='local_delivery_checkout_v2';let draft;try{draft=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(_){}if(!draft)location.replace('/local-delivery.html');const returnPage=draft.returnPage==='/meal.html'?'/meal.html':'/local-delivery.html';document.querySelector('#formBack').href=returnPage;const n=x=>Math.max(0,Math.round(Number(x)||0)),total=n(draft.items)+n(draft.fee),s=(()=>{try{return JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null')}catch(_){return null}})(),snap=(()=>{try{return JSON.parse(localStorage.getItem('aditya_studio_wallet_snapshot_v1')||'null')}catch(_){return null}})(),wallet=n(s?.walletBalance??snap?.balance);document.querySelector('#price').textContent='₹'+total.toLocaleString('en-IN');document.querySelector('#breakdown').textContent='सामान ₹'+n(draft.items)+' + delivery ₹'+n(draft.fee);document.querySelector('#wallet').textContent='₹'+wallet.toLocaleString('en-IN');const walletOk=wallet>=total,cashOk=total<=500;const w=document.querySelector('#walletOption input'),c=document.querySelector('#cashOption input');w.disabled=!walletOk;c.disabled=!cashOk;if(!walletOk)document.querySelector('#walletOption').classList.add('disabled');else document.querySelector('#addMoney').remove();if(!cashOk){document.querySelector('#cashOption').classList.add('disabled');document.querySelector('#cashText').textContent='Cash on Delivery केवल ₹500 तक के order के लिए है।'}
function applyWalletBalance(latest){
  const amount=n(latest), walletOption=document.querySelector('#walletOption'), walletInput=walletOption.querySelector('input'), addMoney=document.querySelector('#addMoney');
  document.querySelector('#wallet').textContent='₹'+amount.toLocaleString('en-IN');
  walletInput.disabled=amount<total;
  walletOption.classList.toggle('disabled',amount<total);
  if(amount>=total&&addMoney)addMoney.remove();
  if(amount<total)walletOption.querySelector('span').textContent='Wallet में पूरे ₹'+total.toLocaleString('en-IN')+' होने पर यह option चालू होगा।';
}
async function refreshWalletBalance(){
  if(!s?.sessionToken)return;
  try{
    const response=await fetch('/api/restore-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:s.mobile||'',sessionToken:s.sessionToken})});
    const account=await response.json();
    if(!response.ok||!account?.ok)return;
    const latest=n(account.walletBalance);
    s.walletBalance=latest;
    localStorage.setItem('aditya_studio_session_v1',JSON.stringify(s));
    localStorage.setItem('aditya_studio_wallet_snapshot_v1',JSON.stringify({id:account.id||snap?.id||'',mobile:s.mobile||account.mobile||'',name:account.name||snap?.name||'',balance:latest,pendingBalance:n(account.walletPendingBalance),at:Date.now()}));
    applyWalletBalance(latest);
  }catch(_){/* Offline me saved wallet amount hi dikhega. */}
}
refreshWalletBalance();
function safe(text){const el=document.createElement('div');el.textContent=String(text||'');return el.innerHTML;}
function foodOrderNumber(order){const raw=String(order?.id||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();return 'FD-'+(raw.slice(-8)||String(Date.now()).slice(-8));}
function showFoodSuccess(order){const item=safe(order?.title||draft.title||'Food order'),date=safe(draft.neededDate||''),time=safe(draft.neededTime||''),pre=String(order?.foodOrderType||draft.foodOrderType||'')==='pre-book',label=pre?'PRE-BOOK CONFIRMED':'ORDER CONFIRMED',heading=pre?'आपका pre-book सफल हुआ!':'आपका order सफल हुआ!',detail=pre?'का pre-book दर्ज हो गया है।':'का order दर्ज हो गया है।';document.body.innerHTML='<main class="payment-page"><section class="payment-card price-card" style="margin-top:34px;overflow:hidden;position:relative"><div style="font-size:48px;letter-spacing:9px;animation:foodPop .8s ease-out both">🎉🎊✨</div><p style="color:#86efac;font-weight:900;letter-spacing:.08em">'+label+'</p><h1 style="margin:4px 0 12px">'+heading+'</h1><p style="color:#cbd5e1">'+item+' '+detail+'</p><div style="margin:20px auto;padding:16px;background:#081426;border:1px dashed #62d3ff;border-radius:15px;max-width:340px"><small style="color:#9aaccc">ORDER NUMBER</small><strong style="display:block;font-size:26px;letter-spacing:1px;color:#fef08a;margin-top:5px">'+foodOrderNumber(order)+'</strong></div><p style="color:#cbd5e1">Delivery: '+date+(time?' · '+time:'')+'</p><p style="color:#a7f3d0;font-size:13px">यह screen तब तक रहेगी जब तक आप आगे नहीं जाते।</p><button id="foodOrders" class="confirm">Order देखें</button></section></main><style>@keyframes foodPop{0%{transform:scale(.2) rotate(-15deg);opacity:0}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}</style>';document.querySelector('#foodOrders').onclick=()=>{sessionStorage.removeItem(KEY);sessionStorage.removeItem('food_order_success_v1');sessionStorage.setItem('local_delivery_view_v1',JSON.stringify({tab:'orders',active:null}));location.href='/local-delivery.html'};}
async function confirmFoodOrder(method){
  const btn=document.querySelector('#confirm');
  btn.disabled=true; btn.textContent='Order confirm हो रहा है…';
  draft.paymentMethod=method==='cash'?'cash-on-delivery':'wallet';
  draft.confirmed=true; draft.orderId=draft.orderId||crypto.randomUUID();
  sessionStorage.setItem(KEY,JSON.stringify(draft));
  const lines=Array.isArray(draft.lineItems)&&draft.lineItems.length?draft.lineItems:[{name:String(draft.title||'Food order'),quantity:String(draft.quantity||'1')}];
  const neededBy=draft.neededDate&&draft.neededTime?new Date(draft.neededDate+'T'+draft.neededTime+':00').toISOString():new Date(Date.now()+3600000).toISOString();
  const order={id:draft.orderId,title:String(draft.title||lines[0].name||'Food order').trim(),area:String(draft.area||'').trim(),address:String(draft.address||'').trim(),district:String(draft.district||'').trim(),deliveryVillage:String(draft.deliveryVillage||'').trim(),quantity:String(lines[0].quantity||'1'),lineItems:lines,description:String(draft.description||''),category:'Food',neededBy,items:Number(draft.items||0),fee:Number(draft.fee||0),paymentMode:draft.paymentMethod,foodOrderType:draft.foodOrderType==='pre-book'?'pre-book':'order-now',directFoodOrder:true,customerHold:0,helperHold:0,alreadyPurchased:false,status:'open',messages:[]};
  try{
    let response,out,lastError;
    for(let attempt=0;attempt<2;attempt++){try{response=await fetch('/api/local-delivery/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:s?.mobile||'',sessionToken:s?.sessionToken||'',action:'create',order})});out=await response.json();if(!response.ok||!out?.ok)throw Error(out?.message||'Order confirm नहीं हुआ।');break}catch(err){lastError=err;if(attempt===1||!(err instanceof TypeError))throw err}}
    if(!out)throw lastError||Error('Order confirm नहीं हुआ।');
    if(Number.isFinite(Number(out.walletBalance))&&s){s.walletBalance=Number(out.walletBalance);localStorage.setItem('aditya_studio_session_v1',JSON.stringify(s));}
    draft.completedOrder=out.order;
    sessionStorage.setItem(KEY,JSON.stringify(draft));
    sessionStorage.setItem('food_order_success_v1',JSON.stringify({order:out.order,d:draft,at:Date.now()}));
    showFoodSuccess(out.order);
  }catch(err){btn.disabled=false;btn.textContent='Order confirm करें';document.querySelector('#message').textContent=err.message||'Order confirm नहीं हुआ।';}
}
let cod=false;
document.querySelectorAll('[name=method]').forEach(input=>{
  input.onchange=()=>{
    document.querySelectorAll('.pay-option').forEach(option=>option.classList.remove('selected'));
    input.closest('.pay-option').classList.add('selected');
    const box=document.querySelector('#codBox'); cod=false;
    box.innerHTML=input.value==='cash'?'<div class="cod-warning"><b>⚠️ Cash on Delivery confirmation</b><p>घर में सामान लेकर delivery boy आएगा तो आपको सामान की पूरी payment करनी पड़ेगी।</p><div class="choice-row"><button class="yes" id="yes">हां</button><button class="no" id="no">नहीं</button></div></div>':'';
    const yes=document.querySelector('#yes'), no=document.querySelector('#no');
    if(yes)yes.onclick=()=>{cod=true;box.innerHTML='<div class="cod-warning">✓ Cash on Delivery स्वीकार किया गया।</div>';};
    if(no)no.onclick=()=>{c.checked=false;c.closest('.pay-option').classList.remove('selected');box.innerHTML='';};
  };
});
document.querySelector('#confirm').onclick=()=>{
  const method=document.querySelector('[name=method]:checked')?.value, msg=document.querySelector('#message');
  if(!method){msg.textContent='पहले payment option चुनें।';return;}
  if(method==='cash'&&!cod){msg.textContent='Cash on Delivery के लिए हां करें।';return;}
  if(returnPage==='/meal.html'){confirmFoodOrder(method);return;}
  draft.paymentMethod=method==='cash'?'cash-on-delivery':'wallet';draft.confirmed=true;sessionStorage.setItem(KEY,JSON.stringify(draft));location.href=returnPage+'?checkout=confirmed';
};
function tick(){const left=Math.max(0,Number(draft.expiresAt||0)-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left/1000)%60;document.querySelector('#timer').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(!left){document.querySelector('#confirm').disabled=true;document.querySelector('#message').textContent='Payment time पूरा हो गया। Form से फिर try करें।';}}
if(draft?.completedOrder){showFoodSuccess(draft.completedOrder)}else{tick();setInterval(tick,1000);}
</script></body></html>
