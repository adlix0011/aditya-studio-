<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Payment</title><link rel="stylesheet" href="/mobile-design.css?v=payment181"><style>body{margin:0;background:#080d1b;color:#eef2ff;font-family:Arial,sans-serif}.payment-page{max-width:620px;margin:auto;padding:22px 16px 45px}.payment-top{display:flex;justify-content:space-between;align-items:center}.payment-top a{color:#c4b5fd;text-decoration:none}.payment-card{margin-top:18px;padding:19px;border:1px solid #334155;border-radius:18px;background:linear-gradient(145deg,#121d37,#0d1427)}.price-card{text-align:center;border-color:#22c55e}.price-card span{display:block;color:#a7f3d0}.price-card strong{display:block;font-size:38px;color:#fef08a;margin:7px 0}.timer{margin-top:14px;padding:12px;border-radius:12px;background:linear-gradient(90deg,#581c87,#be185d);font-size:19px;font-weight:900;color:#fff;text-align:center}.wallet-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wallet-amount{font-size:23px;color:#5eead4;font-weight:900}.pay-option{display:flex;align-items:center;gap:12px;margin-top:14px;padding:16px;border:2px solid #334155;border-radius:14px;background:#111b31;cursor:pointer}.pay-option.selected{border-color:#22c55e;background:#0b3527}.pay-option.disabled{opacity:.58}.pay-option input{width:21px;height:21px;accent-color:#22c55e}.pay-option b,.pay-option span{display:block}.pay-option span{font-size:12px;color:#b9c6da;margin-top:4px}.add-money{margin-left:auto;padding:9px 11px;border-radius:9px;background:#f59e0b;color:#1c1200;font-weight:900;text-decoration:none}.cod-warning{margin-top:14px;padding:15px;border-radius:12px;background:#422006;border:1px solid #f59e0b;color:#fef3c7}.choice-row{display:flex;gap:10px}.choice-row button{flex:1;padding:11px;border:0;border-radius:9px;font-weight:900}.yes{background:#22c55e;color:#06210f}.no{background:#334155;color:#fff}.confirm{width:100%;padding:15px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#2563eb,#059669);color:#fff;font-size:17px;font-weight:900}.message{min-height:22px;margin-top:12px;color:#fca5a5;font-weight:700}.checkout-note{color:#a8b5ca;font-size:12px;line-height:1.5}</style></head><body><main class="payment-page"><div class="payment-top"><a href="/local-delivery.html">← Form पर वापस</a><b>SECURE ORDER PAYMENT</b></div><section class="payment-card price-card"><span>इस order की कुल रकम</span><strong id="price">₹0</strong><small id="breakdown"></small><div class="timer">⏳ Payment समय: <span id="timer">05:00</span></div></section><section class="payment-card"><div class="wallet-row"><div><b>👛 Wallet payment</b><span class="checkout-note">Wallet balance</span></div><div class="wallet-amount" id="wallet">₹0</div></div><label class="pay-option" id="walletOption"><input type="radio" name="method" value="wallet"><div><b>Wallet से भुगतान करें</b><span>पूरा amount wallet से pay होगा।</span></div><a id="addMoney" class="add-money" href="/add-money?return=%2Flocal-delivery">Add Money</a></label><label class="pay-option" id="cashOption"><input type="radio" name="method" value="cash"><div><b>💵 Cash on Delivery</b><span id="cashText">घर पहुंचने पर delivery boy को सामान की पूरी payment दें।</span></div></label><div id="codBox"></div><div id="message" class="message"></div><button id="confirm" class="confirm">Order confirm करें</button></section></main><script>const KEY='local_delivery_checkout_v2';let draft;try{draft=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(_){}if(!draft)location.replace('/local-delivery.html');const n=x=>Math.max(0,Math.round(Number(x)||0)),total=n(draft.items)+n(draft.fee),s=(()=>{try{return JSON.parse(localStorage.getItem('aditya_studio_session_v1')||localStorage.getItem('aditya_studio_persistent_login_v2')||'null')}catch(_){return null}})(),snap=(()=>{try{return JSON.parse(localStorage.getItem('aditya_studio_wallet_snapshot_v1')||'null')}catch(_){return null}})(),wallet=n(s?.walletBalance??snap?.balance);document.querySelector('#price').textContent='₹'+total.toLocaleString('en-IN');document.querySelector('#breakdown').textContent='सामान ₹'+n(draft.items)+' + delivery ₹'+n(draft.fee);document.querySelector('#wallet').textContent='₹'+wallet.toLocaleString('en-IN');const walletOk=wallet>=total,cashOk=total<=500;const w=document.querySelector('#walletOption input'),c=document.querySelector('#cashOption input');w.disabled=!walletOk;c.disabled=!cashOk;if(!walletOk)document.querySelector('#walletOption').classList.add('disabled');else document.querySelector('#addMoney').remove();if(!cashOk){document.querySelector('#cashOption').classList.add('disabled');document.querySelector('#cashText').textContent='Cash on Delivery केवल ₹500 तक के order के लिए है।'}let cod=false;document.querySelectorAll('[name=method]').forEach(x=>x.onchange=()=>{document.querySelectorAll('.pay-option').forEach(a=>a.classList.remove('selected'));x.closest('.pay-option').classList.add('selected');const box=document.querySelector('#codBox');cod=false;box.innerHTML=x.value==='cash'?'<div class="cod-warning"><b>⚠️ Cash on Delivery confirmation</b><p>घर में सामान लेकर delivery boy आएगा तो आपको सामान की पूरी payment करनी पड़ेगी।</p><div class="choice-row"><button class="yes" id="yes">हां</button><button class="no" id="no">नहीं</button></div></div>':'';document.querySelector('#yes')?.addEventListener('click',()=>{cod=true;box.innerHTML='<div class="cod-warning">✓ Cash on Delivery स्वीकार किया गया।</div>'});document.querySelector('#no')?.addEventListener('click',()=>{c.checked=false;c.closest('.pay-option').classList.remove('selected');box.innerHTML=''})});document.querySelector('#confirm').onclick=()=>{const method=document.querySelector('[name=method]:checked')?.value,msg=document.querySelector('#message');if(!method){msg.textContent='पहले payment option चुनें।';return}if(method==='cash'&&!cod){msg.textContent='Cash on Delivery के लिए हां करें।';return}draft.paymentMethod=method==='cash'?'cash-on-delivery':'wallet';draft.confirmed=true;sessionStorage.setItem(KEY,JSON.stringify(draft));location.href='/local-delivery.html?checkout=confirmed'};function tick(){let left=Math.max(0,Number(draft.expiresAt||0)-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left/1000)%60;document.querySelector('#timer').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(!left){document.querySelector('#confirm').disabled=true;document.querySelector('#message').textContent='Payment time पूरा हो गया। Form से फिर try करें।'}}tick();setInterval(tick,1000);</script></body></html>
