<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrderBro accounts</title><style>body{font:16px Arial;background:#091225;color:#eaf2ff;max-width:760px;margin:25px auto;padding:15px}.card{background:#121e36;padding:16px;border-radius:14px;margin:12px 0}input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;background:#071022;color:#fff;border:1px solid #40547d;border-radius:8px}button{padding:11px 14px;border:0;border-radius:8px;background:#7142ff;color:#fff;font-weight:bold}.note{color:#7dffb9}</style><h1>🍽️ OrderBro Shop Access</h1><p>यहीं से हर shop का अलग Login ID और password बनाएं।</p><form class="card" id="f"><input name="shopName" placeholder="Shop name, e.g. Grace Pizza" required><input name="displayName" placeholder="Display name (optional)"><input name="phone" placeholder="Shop phone number"><input name="username" placeholder="Login ID" required><input name="password" type="password" placeholder="Password (minimum 6 characters)" required><button>Create shop login</button><p class="note" id="n"></p></form><div class="card"><h2>Active shops</h2><div id="list">Loading…</div></div><script>async function load(){let d=await fetch('/admin/orderbro-accounts').then(r=>r.json());list.innerHTML=(d.accounts||[]).map(x=>'<p><b>'+x.shopName+'</b><br>Login ID: '+x.username+' · '+(x.phone||'no phone')+'</p>').join('')||'No shop login yet'}f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),r=await fetch('/admin/orderbro-accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),o=await r.json();n.textContent=o.ok?'✓ Login created. Give this ID/password to the shop.':o.message||'Error';if(o.ok){f.reset();load()}};load()</script>
