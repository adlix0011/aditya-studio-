<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop & Delivery Management</title><style>body{font:16px Arial;background:#091225;color:#eaf2ff;max-width:900px;margin:25px auto;padding:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.choice{font-size:18px;text-align:left;padding:22px;background:#18284a;border:1px solid #4a63a0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#121e36;padding:16px;border-radius:14px;margin:12px 0}input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;background:#071022;color:#fff;border:1px solid #40547d;border-radius:8px}button{padding:11px 14px;border:0;border-radius:8px;background:#7142ff;color:#fff;font-weight:bold}.note{color:#7dffb9;min-height:20px}h2{margin-top:0}@media(max-width:650px){.grid,.choices{grid-template-columns:1fr}}</style><h1>🍽️ Shop & Delivery Management</h1><p>Shop और delivery boy का login अलग बनाएं।</p><div class="choices" id="choices"><button class="choice" type="button" onclick="openForm('delivery')">🚚 Delivery Boy ID Create<br><small>Create delivery login</small></button><button class="choice" type="button" onclick="openForm('shop')">🍽️ Shop ID Create<br><small>Create shop login</small></button></div><div class="grid"><form class="card" id="shopForm" hidden><h2>🍽️ Shop login</h2><input name="shopName" placeholder="Shop name, e.g. Grace Pizza" required><input name="displayName" placeholder="Shop owner / display name" required><input name="phone" placeholder="Shop WhatsApp number" required><input name="username" placeholder="Shop Login ID" required><input name="password" type="password" placeholder="Shop password (minimum 6 characters)" required><button>Create shop login</button><p class="note"></p></form><form class="card" id="deliveryForm" hidden><h2>🚚 Delivery boy login</h2><input name="displayName" placeholder="Delivery boy name" required><input name="phone" placeholder="Delivery boy WhatsApp number" required><input name="username" placeholder="Delivery boy Login ID" required><input name="password" type="password" placeholder="Delivery boy password (minimum 6 characters)" required><button>Create delivery login</button><p class="note"></p></form></div><div class="card"><h2>🔔 Delivery Manage alert test</h2><p>यह button registered Delivery Manage APK को असली Firebase test notification भेजता है। Phone lock करके भी test करें।</p><input id="testTitle" value="🧪 Delivery Manage test alert" maxlength="90" aria-label="Test alert title"><input id="testMessage" value="यदि यह notification दिखा है, तो Firebase alert सही चल रहा है।" maxlength="180" aria-label="Test alert message"><button type="button" onclick="testAlert()">🔔 Test alert भेजें</button><p class="note" id="testNote"></p></div><div class="card"><h2>Active accounts</h2><div id="list">Loading…</div></div><script>function openForm(type){document.getElementById('choices').hidden=true;shopForm.hidden=type!=='shop';deliveryForm.hidden=type!=='delivery'} async function load(){let d=await fetch('/admin/orderbro-accounts').then(r=>r.json());list.innerHTML=(d.accounts||[]).map(x=>'<p><b>'+(x.role==='delivery'?'🚚 Delivery boy: ':'🍽️ Shop: ')+(x.displayName||x.shopName)+'</b><br>Login ID: '+x.username+' · '+(x.phone||'no phone')+'</p>').join('')||'No account yet'}async function save(form,role){let note=form.querySelector('.note'),d=Object.fromEntries(new FormData(form));d.role=role;let r=await fetch('/admin/orderbro-accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),o=await r.json();note.textContent=o.ok?'✓ Login created. ID/password user को दे दें।':o.message||'Error';if(o.ok){form.reset();load()}}async function testAlert(){testNote.textContent='Firebase test alert भेजा जा रहा है…';let r=await fetch('/admin/orderbro/test-alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:testTitle.value,message:testMessage.value})}),o=await r.json();testNote.textContent=(o.ok?'✓ ':'⚠ ')+(o.message||'Test alert failed');}shopForm.onsubmit=e=>{e.preventDefault();save(shopForm,'shop')};deliveryForm.onsubmit=e=>{e.preventDefault();save(deliveryForm,'delivery')};load()</script>
